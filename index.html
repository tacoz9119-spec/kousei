  P.h2('第一幕' + r(0,.25)); P.para(obj.plot.a1);
  P.h2('◆ プロットポイント1', P.C.point); P.para(obj.plot.pp1);
  P.h2('第二幕前半' + r(.25,.5)); P.para(obj.plot.a2a);
  P.h2('◆ ミッドポイント', P.C.point); P.para(obj.plot.mp);
  P.h2('第二幕後半' + r(.5,.75)); P.para(obj.plot.a2b);
  P.h2('◆ プロットポイント2', P.C.point); P.para(obj.plot.pp2);
  P.h2('第三幕' + r(.75,1)); P.para(obj.plot.a3);
  if(withHook){ P.h2('次の話への引き'); P.para(obj.plot.hook); }
}
function pdfScenes(P, w, list){
  if(!list.length){ P.note('シーンはまだありません。'); return; }
  list.forEach(function(sc, i){
    P.h2('シーン' + (i+1) + '　' + SEG_BY[sc.seg].label);
    (w.schema.card || []).forEach(function(f){ P.field(f.label, getPath(sc, ['values', f.id]), 4); });
    if(!isBlank(sc.min)) P.field('長さ', sc.min + '分', 4);
  });
}
async function makePdf(){
  var m = S.modal, w = curWork();
  if(!Object.keys(m.sel).some(function(k){ return m.sel[k]; })){ m.err = '入れる内容を1つ以上選んでください。'; renderModal(false); return; }
  m.busy = true; m.err = ''; renderModal(false);
  try{
    await ensurePdfDeps();
    var doc = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true});
    doc.addFileToVFS('kp.ttf', fontBin); doc.addFont('kp.ttf', 'kp', 'normal'); doc.setFont('kp', 'normal');
    var P = pdfWriter(doc), first = true;
    P.title(w.title || '無題の作品', workMeta(w) + '　出力日 ' + fmtDate(Date.now()));
    function section(t){ P.h1(t, !first); first = false; }
    if(m.sel.basic){
      section('基本設定');
      var lenStr = w.kind === 'serial' ? '全' + w.epOrder.length + '話（基本の1話' + w.baseLength + '分）' : w.length + '分';
      var bsch = w.schema.basic || [], lead = 0;
      while(lead < bsch.length && !isHead(bsch[lead]) && !bsch[lead].nl && bsch[lead].w !== 'full') lead++;
      bsch.forEach(function(f, i){ if(i === lead) P.field('尺', lenStr); if(isHead(f)) P.h2(f.label, P.C.accent); else P.field(f.label, getPath(w, ['basic', f.id])); });
      if(lead >= bsch.length) P.field('尺', lenStr);
    }
    if(m.sel.people){
      section('人物');
      if(!w.people.length) P.note('人物はまだ登録されていません。');
      sortPeople(w.people).forEach(function(p){
        P.h2((p.name || '名前未設定') + (p.role ? '（' + roleLabel(p.role) + '）' : ''));
        if(!hasProfile(p)) return;
        visiblePF(w, p).forEach(function(f){ var bf = f.link && linkField(w.schema.basic, f.link); P.field(f.label, bf ? getPath(w, ['basic', bf.id]) : getPath(p, ['values', f.id]), 4); });
        if(p.arc){ P.label('アーク', 4);(w.schema.arc || []).forEach(function(f){ P.field(f.label, getPath(p, ['arc', f.id]), 8); }); }
      });
    }
    if(w.kind !== 'serial'){
      if(m.sel.plot){ section('プロット'); pdfPlot(P, w, w.length, false); }
      if(m.sel.boxes){ section('箱書き'); pdfScenes(P, w, w.scenes); }
    } else {
      if(m.sel.series){
        section('シリーズ構成');
        P.note(epsOf(w).map(function(ep, i){ return '第' + (i+1) + '話 ' + ep.length + '分'; }).join('　'));
        ACTS.forEach(function(x){
          var ids = (w.series[x[0]].eps || []).slice().sort(function(a,b){ return epNo(w,a)-epNo(w,b); });
          P.h2(x[1] + (ids.length ? '（' + ids.map(function(id){ return '第' + epNo(w,id) + '話'; }).join('・') + '）' : ''));
          P.para(w.series[x[0]].text);
          if(x[0] === 'a1'){ P.h2('◆ プロットポイント1', P.C.point); P.para(w.series.pp1); }
          if(x[0] === 'a2'){ P.h2('◆ ミッドポイント', P.C.point); P.para(w.series.mp); P.h2('◆ プロットポイント2', P.C.point); P.para(w.series.pp2); }
        });
      }
      if(m.sel.eps){
        epsOf(w).forEach(function(ep, i){
          section('第' + (i+1) + '話（' + ep.length + '分）');
          P.h2('プロット', P.C.accent); pdfPlot(P, ep, ep.length, true);
          P.space(4); P.h2('箱書き', P.C.accent); pdfScenes(P, w, ep.scenes);
        });
      }
    }
    var n = doc.getNumberOfPages();
    for(var i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120,128,138); doc.text((w.title || '') + '　' + i + ' / ' + n, P.PW/2, P.PH - 10, {align:'center'}); }
    var blob = doc.output('blob');
    var name = (w.title || 'Kousei').replace(/[\\/:*?"<>|]/g, '_') + '.pdf';
    m.busy = false; renderModal(false);
    try{ await S.dl.save({filename:name, data:blob}); closeModal(); toast('PDFを保存しました'); }
    catch(e){ if(e && e.code === 'declined'){ return; } m.err = 'PDFを保存できませんでした。'; renderModal(false); }
  }catch(err){
    m.busy = false; m.err = 'PDFを作成できませんでした。もう一度お試しください。'; renderModal(false);
  }
}

/* ---------- boot ---------- */
async function boot(){
  try{ var ui = JSON.parse(localStorage.getItem(LOCAL_KEY + '-ui') || 'null'); if(ui){ if(KINDS[ui.tplKind]) S.tplKind = ui.tplKind; if(ui.listFilter && (ui.listFilter === 'all' || KINDS[ui.listFilter])) S.listFilter = ui.listFilter; } }catch(e){}
  var local = await loadLocal();
  if(local){
    S.templates = local.templates || null; S.works = local.works || {}; S.episodes = local.episodes || {};
    if(local.meta){ M = local.meta; M.works = M.works || {}; M.tpl = M.tpl || {base:0, dirty:false}; M.deleted = M.deleted || {}; }
    dirtyEps = local.dirtyEps || {};
  }
  var fresh = !S.templates;
  var tch = migrateTemplates();
  if(fresh) M.tpl.fresh = true; else if(tch) saveTemplatesSoon(true);
  Object.keys(S.works).forEach(function(id){
    var w = S.works[id];
    if(w.kind === 'serial' && !S.episodes[id]) S.episodes[id] = {};
    if(migrateWork(w)) saveWorkQuiet(w, true);
  });
  render();
  persistLocalNow();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  Store.init();
  render();
}
boot();
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').then(function(){
    return navigator.serviceWorker.ready;
  }).then(function(reg){ if(reg.active) reg.active.postMessage('ensure'); }).catch(function(){});
}
})();
