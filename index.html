<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kousei</title>
<meta name="theme-color" content="#F5F6F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kousei">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" id="touchIcon" href="icon-180.png">
<script>
/* ホーム画面のアイコン：iPadはホーム画面に追加したときに1回だけアイコンを取り込む。
   そのときの外観がダークなら黒背景に白文字、ライトなら白背景に黒文字のアイコンを使う */
(function(){
  var l=document.getElementById('touchIcon'), m=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  function u(){ l.href=(m&&m.matches)?'icon-180-dark.png':'icon-180.png'; }
  u(); if(m){ if(m.addEventListener) m.addEventListener('change',u); else if(m.addListener) m.addListener(u); }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap">
<style>
/* Layout: sticky work header + tab strip, content in a centered 1440px column; plot uses a 1:2:1 grid that mirrors screen time. */
:root{
  --bg:#F5F6F6; --surface:#FCFCFB; --surface2:#F5F6F6; --sunken:#ECEEEE; --bar:#F5F6F6;
  --fg:#1D2224; --fg2:#3A4244; --muted:#5C6668; --line:#CDD2D3; --line2:#C3C8C9;
  --accent:#1D2224; --accent-strong:#1D2224; --accent-weak:#E6E9E9; --on-accent:#FCFCFB; --mark:#2D5B8C;
  --act1:#C9D8EA; --act1-fg:#1E4166; --act2:#2D5B8C; --act2-fg:#FFFFFF; --act3:#8FADCF; --act3-fg:#14304F;
  --point-bg:#F8EFEB; --point-line:#E0BCAF; --point-fg:#8E3420; --point-mark:#B23F27;
  --input-bg:#FCFCFB; --short:#9A5B00; --danger:#B3261E; --danger-weak:#FBE9E7; --overlay:rgba(29,34,36,.5); --shadow:rgba(29,34,36,.16);
  --f-body:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
  --f-title:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131718; --surface:#1E2325; --surface2:#181D1E; --sunken:#262C2E; --bar:#131718;
  --fg:#E7E4DD; --fg2:#C9CCC8; --muted:#98A2A4; --line:#343C3E; --line2:#3E4749;
  --accent:#E7E4DD; --accent-strong:#E7E4DD; --accent-weak:#2A3133; --on-accent:#131718; --mark:#8DB4E2;
  --act1:#2A3B52; --act1-fg:#D3E2F4; --act2:#8DB4E2; --act2-fg:#0E1724; --act3:#4B6A90; --act3-fg:#EAF1FA;
  --point-bg:#33241E; --point-line:#6E4A3C; --point-fg:#F0B49C; --point-mark:#E5835F;
  --input-bg:#181D1E; --short:#EDC06A; --danger:#F2B8B5; --danger-weak:#3A1F1E; --overlay:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#131718; --surface:#1E2325; --surface2:#181D1E; --sunken:#262C2E; --bar:#131718;
  --fg:#E7E4DD; --fg2:#C9CCC8; --muted:#98A2A4; --line:#343C3E; --line2:#3E4749;
  --accent:#E7E4DD; --accent-strong:#E7E4DD; --accent-weak:#2A3133; --on-accent:#131718; --mark:#8DB4E2;
  --act1:#2A3B52; --act1-fg:#D3E2F4; --act2:#8DB4E2; --act2-fg:#0E1724; --act3:#4B6A90; --act3-fg:#EAF1FA;
  --point-bg:#33241E; --point-line:#6E4A3C; --point-fg:#F0B49C; --point-mark:#E5835F;
  --input-bg:#181D1E; --short:#EDC06A; --danger:#F2B8B5; --danger-weak:#3A1F1E; --overlay:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5);
  color-scheme:dark; }

html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1440px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.brand{font-family:var(--f-title);font-size:20px;font-weight:600;letter-spacing:.06em}
.spacer{flex:1}
.wtitle{margin:0;font-family:var(--f-title);font-size:21px;font-weight:600;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--danger)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0}
.topbar-in.has-tabs{padding-bottom:2px}
.tab{min-height:44px;padding:0 20px;border:none;background:transparent;color:var(--fg2);font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent-strong);font-weight:700;border-bottom-color:var(--accent)}

/* controls */
.btn{min-height:44px;padding:0 18px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--fg);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface);font-weight:500}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.back{min-height:44px;border:none;background:transparent;color:var(--accent);font-size:15px;display:inline-flex;align-items:center;gap:4px;padding:0 4px}
.icon-btn{width:44px;height:44px;border:none;border-radius:8px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{background:var(--sunken);color:var(--fg)}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.seg button{min-height:40px;padding:0 16px;border:none;border-radius:7px;background:transparent;color:var(--fg2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:500}
.fl{font-size:14px;font-weight:500;color:var(--fg2)}
.fl-link{margin-left:8px;font-size:11px;font-weight:400;opacity:.8}
.p-none{margin:4px 0 18px}
.sub-l{font-size:13px;color:var(--muted)}
.in,.ta,.sel{width:100%;box-sizing:border-box;border:1px solid var(--line2);border-radius:8px;background:var(--input-bg);color:var(--fg);font-size:16px}
.in{height:46px;padding:0 12px}
.ta{padding:10px 12px;line-height:1.75;resize:vertical;min-height:80px}
.sel{height:44px;padding:0 10px;font-size:14px}
.in:focus,.ta:focus,.sel:focus{border-color:var(--accent);outline:2px solid var(--accent-weak);outline-offset:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.ta.one{min-height:46px;height:46px;resize:none;overflow:hidden;line-height:1.5;padding:10px 12px}
.ta.long.l3{min-height:100px;height:100px}
.ta.long{min-height:76px;height:76px;resize:none;overflow:hidden;line-height:1.6;padding:11px 12px}
.f-name{flex:0 1 320px;min-width:200px}
.f-mini{flex:1 1 200px;min-width:140px}
.f-role{flex:0 0 auto}
.f-role .seg{height:46px;box-sizing:border-box;align-items:center;padding:3px}
.f-role .seg button{min-height:38px}
.f-age{flex:0 0 150px;min-width:0}
.basic-top{display:flex;flex-wrap:wrap;gap:20px 24px;align-items:flex-start;margin-bottom:22px}
.f-title{flex:2 1 320px}
.f-short{flex:1 1 180px;max-width:280px}
.f-len{flex:0 0 auto;min-width:120px}
.readout{height:46px;box-sizing:border-box;padding:0 12px;border-radius:8px;background:var(--sunken);display:flex;align-items:center;font-size:16px}
.page{padding-block:28px 48px}

/* list */
.list-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.list-head h1{margin:0;font-size:24px}
.wl-cols,.work-open{display:grid;grid-template-columns:minmax(0,1fr) 130px 110px 120px;gap:12px;align-items:center}
.wl-cols{padding:0 64px 6px 24px;font-size:13px;color:var(--muted)}
.work-rows{display:flex;flex-direction:column;gap:10px}
.work-row{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding-right:10px}
.work-open{flex:1;min-width:0;min-height:72px;padding:12px 0 12px 24px;border:none;background:transparent;text-align:left;font-size:15px}
.work-open .wt{font-family:var(--f-title);font-size:19px;font-weight:600;overflow-wrap:anywhere}
.work-open .dt{color:var(--muted);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:48px 24px;text-align:center;background:var(--surface);border:1px dashed var(--line2);border-radius:12px;color:var(--fg2)}
.empty p{margin:0 0 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.backup{margin-top:32px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.backup h2{margin:0;font-size:16px;flex-basis:100%}
.backup p{margin:0;font-size:14px;color:var(--muted);flex-basis:100%}
.foot{margin-top:20px;font-size:13px;color:var(--muted)}

/* side layout */
.split{display:flex;gap:24px;align-items:flex-start}
.side{width:280px;flex:none;display:flex;flex-direction:column;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.side.narrow{width:208px}
.side-main{flex:1;min-width:0}
.side-row{display:flex;flex-direction:column;gap:2px}
.side-mv{display:flex;justify-content:flex-end;gap:2px;padding-right:2px}
.side-mv .icon-btn{width:44px;height:36px}
.side-h{margin:4px 8px 6px;font-size:15px;font-weight:700}
.side-note{margin:0 8px 8px;font-size:13px;color:var(--muted)}
.side-item{min-height:48px;padding:8px 12px;border:none;border-radius:8px;background:transparent;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--fg2)}
.side-item[aria-current="true"]{background:var(--accent-weak);color:var(--fg);font-weight:700}
.side-item .cnt{font-size:13px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.side-item .two{display:flex;flex-direction:column;align-items:flex-start;line-height:1.4;min-width:0}
.side-item .two small{font-size:13px;color:var(--muted);font-weight:400}
.role-chip{flex:none;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap}
.role-chip.main{background:var(--accent);color:var(--on-accent)}
.role-chip.major{border:1px solid var(--accent);color:var(--accent-strong);font-weight:500}
.add-dash{min-height:48px;border:1.5px dashed var(--line2);border-radius:10px;background:transparent;color:var(--accent);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.add-dash:hover{border-color:var(--accent)}

/* basic & people */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 28px}
.form-grid .wide{grid-column:1 / -1}
.row-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.stack{display:flex;flex-direction:column;gap:20px}
.person-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.person-head .field{min-width:0}
.arc-head{display:flex;align-items:center;justify-content:space-between;height:22px}
.arc-head .link-btn{margin:-11px 0}
.arc-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.link-btn{border:none;background:transparent;color:var(--muted);font-size:13px;min-height:44px;padding:0 4px}
.link-btn:hover{color:var(--fg)}

/* plot */
.plot-bar,.plot-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);gap:16px}
.plot-bar{margin-bottom:16px}
.plot-bar div{min-height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-align:center;padding:4px 8px;font-variant-numeric:tabular-nums}
.b1{background:var(--act1);color:var(--act1-fg)}.b2{background:var(--act2);color:var(--act2-fg)}.b3{background:var(--act3);color:var(--act3-fg)}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.col-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.col-h b{font-size:15px}
.col-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.act2-in{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.half{display:flex;flex-direction:column;gap:12px;min-width:0}
.grow{flex:1;min-height:260px}
.point{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--point-bg);border:1px solid var(--point-line)}
.point label{font-size:14px;font-weight:700;color:var(--point-fg);display:flex;align-items:center;gap:8px}
.point .ta{min-height:64px;border-color:var(--point-line)}
.hook{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--sunken)}
.hook label{font-size:14px;font-weight:700}
.dia{width:11px;height:11px;flex:none}

/* boxes */
.box-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.box-top p{margin:0;font-size:14px;color:var(--fg2)}
.grp{margin-bottom:22px}
.grp-h{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.grp-h h2{margin:0;font-size:17px}
.grp-h span{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
.card-h .no{font-size:14px;font-weight:700;color:var(--mark);margin-right:4px}
.card-h .sel{width:auto;height:36px;font-size:13px;flex:1;min-width:120px;max-width:190px}
.cf{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start}
.cf label{font-size:13px;font-weight:500;color:var(--fg2);padding-top:10px}
.cf .in{height:40px;font-size:15px}
.cf .ta{min-height:64px;font-size:15px;padding:8px 10px}
.cf .ta.one{min-height:40px;height:40px;padding:7px 10px}
.card-add{min-height:120px}

/* series */
.ep-len label{white-space:nowrap}
.ep-len{display:grid;grid-template-columns:minmax(0,1fr) 64px 20px;gap:6px;align-items:center;min-height:46px;padding:0 10px;border-radius:8px}
.ep-len.changed{background:var(--point-bg)}
.ep-len .in{height:38px;text-align:right;font-variant-numeric:tabular-nums}
.ep-len span{font-size:14px;color:var(--muted)}
.series-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:32px;align-items:center}
.chip{height:30px;padding:0 12px;border-radius:15px;background:var(--accent-weak);color:var(--accent-strong);font-size:13px;font-weight:500;display:inline-flex;align-items:center}
.chips .none{font-size:13px;color:var(--muted)}
.ep-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:14px}
.ep-head h2{margin:0;font-size:22px}
.ep-head span{color:var(--fg2)}

/* templates */
.tpl-note{margin:10px 0 18px;font-size:14px;color:var(--fg2)}
.tpl-cols,.tpl-row{display:grid;grid-template-columns:96px minmax(0,1fr) 150px 44px;gap:10px;align-items:center}
.tpl-cols{padding:0 12px 4px;font-size:13px;color:var(--muted)}
.tpl-row{min-height:62px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.tpl-row.fixed{background:var(--surface2)}
.tpl-row .mv{display:flex;gap:4px}
.tag{font-size:13px;color:var(--muted)}

/* modal & toast */
.overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-width:640px;background:var(--surface);border-radius:16px;padding:28px 30px;display:flex;flex-direction:column;gap:20px;box-shadow:0 18px 48px var(--shadow);box-sizing:border-box}
.modal h2{margin:0;font-size:21px}
.modal p{margin:0;color:var(--fg2)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.kind-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kind-grid button{min-height:64px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.kind-grid button b{font-size:15px;font-weight:500}
.kind-grid button small{font-size:12px;color:var(--muted)}
.kind-grid button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-weak)}
.kind-grid button[aria-pressed="true"] b{font-weight:700;color:var(--accent-strong)}
.inline{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
.num{display:flex;align-items:center;gap:8px}
.num .in{width:96px;text-align:right;font-variant-numeric:tabular-nums}
.boxed{background:var(--sunken);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 6px;border-radius:8px}
.check:hover{background:var(--sunken)}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.check small{color:var(--muted);font-size:13px}
.err-text{color:var(--danger);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px var(--shadow);max-width:calc(100vw - 32px)}
.loading{padding:80px 16px;text-align:center;color:var(--muted)}

/* sizing: compact controls matched to 脚本エディタ (buttons and tabs 34px / 13px, body 14px, inputs 15px) */
body{font-size:14px}
.topbar-in{padding-block:10px;gap:8px 14px}
.brand{font-size:18px;font-family:var(--f-body);font-weight:400;letter-spacing:.02em;font-feature-settings:"palt"}
.wtitle{font-size:18px;font-family:var(--f-body);font-weight:500}
.work-open .wt{font-family:var(--f-body);font-weight:500}
.meta{margin-left:-8px}

.side.compact{gap:0}
.side.compact .side-item{min-height:30px;padding:3px 8px;white-space:nowrap;letter-spacing:-.01em}
.side-plot{margin-top:10px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.side-ta{font-size:14px;line-height:1.6;padding:8px 9px;min-height:60px}

.card{position:relative}

body.is-dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}

/* 1行の入力欄は35px（文字15px・行の高さ1.5倍・上下の余白5px）。基本設定・人物・プロットでそろえる */
.ta.auto{resize:none;overflow:hidden;line-height:1.5;padding:5px 10px;min-height:0;height:calc(var(--rows,1) * 1.5em + 12.5px)}
.cf .ta.auto{padding:6px 9px;min-height:0;height:calc(var(--rows,1) * 1.5em + 14px)}
.arc-box{display:block}
.cf-in{min-width:0}
.picks{display:none;flex-wrap:wrap;gap:4px;margin-top:5px}
.cf:focus-within .picks{display:flex}
.pick{height:26px;padding:0 9px;border:1px solid var(--line2);border-radius:13px;background:var(--surface);color:var(--fg2);font-size:12px}
.pick:hover{border-color:var(--accent);color:var(--accent-strong)}
.num-row{display:flex;align-items:center;gap:6px}
.cf .in.min-in{width:64px;height:32px;text-align:right;font-variant-numeric:tabular-nums}
.over{color:var(--danger);font-weight:500;margin-left:4px}
.grp-h span+span::before{content:"・"}
.del-far{margin-left:6px}
.tpl-cols,.tpl-row{grid-template-columns:64px minmax(0,1fr) 128px 84px 96px 34px}

.tpl-span{grid-column:3 / -1}
.num-cell{display:flex;align-items:center;gap:6px;font-size:13px}
.in.sm{width:52px;height:34px;text-align:right;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;min-height:34px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.hits{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow-y:auto;margin-top:6px}
.hit{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.hit:hover{border-color:var(--accent)}

.narrow-only{display:none}
/* トップ画面：中身の幅を絞り、同期とバックアップは区切り線の下に控えめに置く */
.wrap.list-w{max-width:820px}
/* 基本設定：まとまりごとのカード */
.basic-b .bhead{margin-bottom:18px}
.basic-b .bhead .frow{align-items:flex-end}
.basic-b .in,.basic-b .ta{background:var(--sunken);border-color:transparent}
.basic-b .in:focus,.basic-b .ta:focus{background:var(--input-bg);border-color:var(--accent)}
.basic-b .fl{font-size:12.5px;font-weight:500;color:var(--muted)}
.basic-b #b-title{height:50px}
.basic-b .readout{height:38px}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px 20px;min-width:0}
.bcard.wide{grid-column:1 / -1}
.bcard-h{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--fg)}
.bcard-h::before{content:"";flex:none;width:4px;height:15px;border-radius:2px;background:var(--mark)}
.bcard .frow{gap:14px 20px;margin-bottom:14px}
.bcard .frow:last-child{margin-bottom:0}
.bcard .fw-half{flex-basis:calc(50% - 10px)}
.tpl-row.is-h{background:var(--accent-weak)}
.tpl-row.is-h .in{font-weight:700}
.h-tag{font-weight:700;color:var(--mark)}
.tpl-adds{display:flex;gap:12px;flex-wrap:wrap}
.tpl-adds .add-dash{flex:1 1 200px}
.tpl-reset{margin-top:20px;text-align:right}
/* 人物：名前と役割を上に、プロフィールとアークをカードに */
.people-a .split{gap:20px}
.people-a .side{background:var(--surface);border-radius:14px;width:240px}
.side-top{display:flex;align-items:baseline;justify-content:space-between;padding:2px 8px 8px;font-size:13px;color:var(--muted)}
.side-top b{font-size:14px;color:var(--fg)}
.people-a .side-item[aria-current]{background:var(--accent-weak)}
.side-copy{align-self:center;min-height:30px;font-size:12.5px;color:var(--muted);margin-top:2px}
.people-a .side-main{display:flex;flex-direction:column;gap:16px}
.phead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.phead .p-nm{flex:1 1 260px;min-width:0}
.people-a #p-name{height:50px}
.people-a .seg{background:var(--sunken);border-color:transparent;padding:3px;gap:2px}
.people-a .seg button{min-height:36px}
.people-a .seg button[aria-pressed="true"]{background:var(--act2);color:var(--act2-fg);font-weight:700}
.bcard-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.bcard-top .bcard-h{margin:0}
.bcard-top .link-btn{min-height:28px;text-decoration:underline}
.arc-flow{display:flex;align-items:stretch;gap:8px}
.arc-flow > .field{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.arc-flow > .field .ta{flex:1 1 auto}
.arc-ar{flex:none;width:22px;padding-top:36px;display:flex;justify-content:center;color:var(--mark)}
.arc-flow.tall{flex-direction:column;align-items:stretch}
.arc-flow.tall > .field{flex:none}
.arc-flow.tall .arc-ar{width:auto;padding:0;transform:rotate(90deg)}
.p-del{text-decoration:underline;padding:0}
.people-a .f-role .seg{height:38px;padding:3px}
.people-a .f-role .seg button{min-height:30px}
/* 箱書き：段の見出しを幕の色の帯に、入力欄を灰色の塗りに */
.side.compact{background:var(--surface);border-radius:14px}
.side.compact .side-item{justify-content:flex-start;gap:8px}
.side.compact .side-item .cnt{margin-left:auto}
.side.compact .side-item[aria-current]{background:var(--accent-weak)}
.mk{flex:none;width:10px;height:10px;display:inline-flex;align-items:center;justify-content:center}
.mk.sq{border-radius:3px}
.mk .dia{width:10px;height:10px}
.side-ta{background:var(--sunken);border-color:transparent}
.side-ta:focus{background:var(--input-bg);border-color:var(--accent)}
.grp-h.b1,.grp-h.b2,.grp-h.b3,.grp-h.pt{align-items:center;padding:6px 14px;border-radius:10px;margin-bottom:12px}
.grp-h.b1 span,.grp-h.b2 span,.grp-h.b3 span{color:inherit;opacity:.85}
.grp-h.pt{background:var(--point-bg);color:var(--point-fg);gap:8px}
.grp-h.pt span{color:inherit;opacity:.85}
/* カードの見出しを、プロットの第一幕と同じ色の帯にする */
.bcard{padding:0 0 20px;overflow:hidden}
.bcard > .frow,.bcard > .arc-flow,.bcard > p{margin-left:20px;margin-right:20px}
.bcard > .bcard-h,.bcard-top{background:var(--act1);color:var(--act1-fg)}
.bcard > .bcard-h{margin:0 0 14px;padding:7px 20px;color:var(--act1-fg)}
.bcard-h::before{display:none}
.bcard-top{margin:0 0 14px;padding:4px 20px;min-height:36px;box-sizing:border-box}
/* 見出しのバー（高さ36px）に収まるよう、アークのバーのボタンは小さめにする */
.bcard-top .btn{min-height:28px;padding:0 10px;font-size:12px;gap:4px}
.bcard-top .btn svg{width:14px;height:14px}
.bcard-top .bcard-h{padding:0;color:inherit}
.bcard-top .link-btn{color:inherit;opacity:.8}
.bcard-top .link-btn:hover{opacity:1}
.bcard > .bcard-top:only-child{margin-bottom:0}
.bcard:has(> .bcard-top:only-child){padding-bottom:0}
/* 基本設定のタイトル・ジャンル・尺、人物の名前・役割も、見出しを青い帯にした角丸の枠にする */
.basic-b .bhead .frow,.phead{align-items:stretch}
.bhead .field,.phead .field{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;gap:0;padding-bottom:14px}
.bhead .field > .fl,.phead .field > .fl{display:block;background:var(--act1);color:var(--act1-fg);padding:7px 20px;font-size:14px;font-weight:700}
.bhead .field > :not(.fl),.phead .field > :not(.fl){margin:14px 20px 0;width:calc(100% - 40px);box-sizing:border-box}
.basic-b .bhead{margin-bottom:16px}
.basic-b .bhead .frow,.phead{gap:16px}
.bhead .field,.phead .field{padding-bottom:18px}
.bhead .f-len{min-width:140px;flex:0 0 auto}
.bhead .fw-title{flex-basis:200px}
.bhead .fw-M{flex-basis:200px}
.basic-b #b-title{height:35px}
.people-a #p-name{height:35px}
.bhead .ta.auto{height:35px}
.basic-b .bhead .readout,.bhead .num .in{height:35px}
.people-a .f-role .seg{height:35px}
.people-a .f-role .seg button{min-height:32px}
.tabs-row{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px}
.tabs-row .tabs{flex:1 0 auto}
.tab-tools{margin-left:auto;display:flex;align-items:center;gap:10px;padding-bottom:3px}
.tab-info{flex:none;font-size:13px;color:var(--fg2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tab-btn{min-height:30px;padding:0 10px;font-size:12.5px}
.tab-btn svg{width:13px;height:13px}
.grp-h .grp-copy{margin:-8px -8px -8px auto;width:32px;height:32px;color:inherit}
.grp-h .grp-copy:hover{background:rgba(127,127,127,.18);color:inherit}
.grp-h .over-pill + .grp-copy{margin-left:4px}
/* 人物・箱書きの左パネル：見出しを灰色の帯にする（選ぶための一覧なので、書き込むカードの青と分ける） */
.people-a .side,.side.compact{padding:0 0 10px;overflow:hidden;gap:2px}
.people-a .side > :not(.side-top),.side.compact > :not(.side-top){margin-left:10px;margin-right:10px}
.side .side-top{background:var(--sunken);color:var(--fg);padding:7px 16px;margin:0 0 8px;font-size:14px}
.side .side-top b{color:inherit}
.side .side-top span{color:var(--muted);font-size:12.5px}
.side .add-dash{width:auto}
.side.narrow.compact{width:232px}
@media (max-width: 980px){ .side.narrow.compact{width:auto} }
/* 役割：脚本エディタの「柱・ト書き・セリフ」と同じ形のボタン */
.people-a .f-role .seg{width:auto;align-self:flex-start;height:35px;padding:0;gap:0;background:var(--surface);border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.people-a .f-role .seg button{min-height:0;height:100%;border-radius:0;padding:0 16px;background:transparent;color:var(--fg);font-weight:400;box-shadow:none}
.people-a .f-role .seg button + button{border-left:1px solid var(--line2)}
.people-a .f-role .seg button[aria-pressed="true"]{background:var(--act2);color:var(--act2-fg);font-weight:700}
.hist-modal{max-height:86vh;overflow:auto}
.hist-modal > *,.hlist li{flex-shrink:0}
.hhead{font-weight:700;color:var(--fg)!important}
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hlist li{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hlist li.on{border-color:var(--accent)}
.hitem{width:100%;border:0;background:var(--surface);text-align:left;padding:9px 12px;display:flex;flex-direction:column;gap:2px;color:var(--fg)}
.hitem:hover{background:var(--sunken)}
.hitem .t{font-weight:700;font-size:14px}
.hitem .m{font-size:12.5px;color:var(--muted)}
.hdet{padding:10px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.hprev{font-size:13px;color:var(--fg2);line-height:1.6;overflow-wrap:anywhere}
.hdead h3{margin:0 0 4px;font-size:14px}
.hdead .sub-l{margin:0 0 8px}
/* カードの最小幅230px：見出しの行（つまみ・シーン番号・段・コピー）が1行に収まるように詰める */
.card-h{gap:2px}
.card-h .sel{padding:0 1px 0 5px;flex:0 1 auto;min-width:0}
.card-h .icon-btn{width:28px}
.grp-h .over-pill{margin-left:auto;background:var(--danger);color:var(--on-accent);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.grp-h .over-pill.short{background:var(--short)}
.grp-h h2 small{font-size:12px;font-weight:400;opacity:.85}
/* シーンのない段：追加ボタンを横いっぱいの細い枠にする */
.card-add.first{grid-column:1/-1;min-height:48px}
.cards .card{border-radius:14px}
.cards .in,.cards .ta,.cards .sel{background:var(--sunken);border-color:transparent}
.cards .in:focus,.cards .ta:focus,.cards .sel:focus{background:var(--input-bg);border-color:var(--accent)}
/* プロット・シリーズ構成：幕の色の見出しを付けたカード */
.pcol{padding:0;gap:0;overflow:hidden;border-radius:14px}
.pcol-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:7px 16px;font-size:14px}
.pcol-hd b{font-weight:700}
.pcol-hd span{font-size:12.5px;opacity:.85;font-variant-numeric:tabular-nums}
.pcol-bd{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;min-width:0}

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var VERSION = '0.95';
var KINDS = {

};
var KIND_ORDER = ['single','serial'];
var SEGS = [
  {k:'a1', label:'第一幕', from:0, to:.25},
  {k:'pp1', label:'プロットポイント1', short:'PP1', side:'プロットポイント(PP)1', point:true},

  {k:'a2b', label:'第二幕後半', from:.5, to:.75},
  {k:'pp2', label:'プロットポイント2', short:'PP2', side:'プロットポイント(PP)2', point:true},
  {k:'a3', label:'第三幕', from:.75, to:1}

var SEG_INDEX = {}; SEGS.forEach(function(s,i){ SEG_INDEX[s.k]=i; });
var SEG_BY = {}; SEGS.forEach(function(s){ SEG_BY[s.k]=s; });
/* 箱書きの本体（帯・コピー・追加ボタン）では略称を使う。左パネル・プロット欄・PDFは正式名のまま */
function segName(s){ return s.short || s.label; }
var ACTS = [['a1','第一幕'],['a2','第二幕'],['a3','第三幕']];
var TPL_TABS = [['basic','基本設定'],['person','人物'],['arc','アーク'],['card','箱書きカード']];
var LOCAL_KEY = 'kousei-planner-v1';

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fld(label, multi){ return {id:'f'+uid(), label:label, multi:!!multi}; }
function mins(L, r){ return Math.round(L * r); }
function fmtDate(t){ if(!t) return ''; var d = new Date(t); return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
function isBlank(v){ return v == null || String(v).trim() === ''; }
function hasContent(obj){ if(!obj) return false; return Object.keys(obj).some(function(k){ return !isBlank(obj[k]); }); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function toInt(v, min, max){ var n = parseInt(String(v).replace(/[^\d]/g,''), 10); if(isNaN(n)) return null; return Math.min(max, Math.max(min, n)); }

var ICON = {
  trash:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h12M7 5V3h4v2M5 5l1 10h6l1-10"/></svg>',
  up:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg>',
  down:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>',
  plus:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3L5 9l6 6"/></svg>',
  undo:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
  redo:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>',
  floppy:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>',
  dup:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>',
  grip:'<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="3.5" r="1.4"/><circle cx="10.5" cy="3.5" r="1.4"/><circle cx="5.5" cy="8" r="1.4"/><circle cx="10.5" cy="8" r="1.4"/><circle cx="5.5" cy="12.5" r="1.4"/><circle cx="10.5" cy="12.5" r="1.4"/></svg>',
  hist:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>',
  arrow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  dia:'<svg class="dia" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l6 6-6 6-6-6z" fill="var(--point-mark)"/></svg>'
};

var BASIC_ORDER = ['ジャンル','ログライン','テーマ','時代','場所（舞台）','主人公の目的','主人公の障害','メモ','類似作品・参考にした作品'];
var LAYOUT = {
  basic:{'ジャンル':{w:'M',rows:1}, 'ログライン':{w:'half',rows:1,nl:true}, 'テーマ':{w:'half',rows:1}, '時代':{w:'half',rows:1,nl:true}, '場所（舞台）':{w:'half',rows:1},
    '主人公の目的':{w:'half',rows:1,nl:true}, '主人公の障害':{w:'half',rows:1}, 'メモ':{w:'half',rows:1,nl:true}, '類似作品・参考にした作品':{w:'half',rows:1}},
  person:{'年齢':{w:'S',rows:1}, '職業':{w:'fill',rows:1}, '目的':{w:'fill',rows:1,nl:true}, '経歴':{w:'full',rows:1,nl:true}, 'ほかの人物との関係':{w:'full',rows:1,nl:true}},
  arc:{'始まりの状態':{rows:1}, '変化のきっかけ':{rows:1}, '終わりの状態':{rows:1}}, card:{'登場人物':{rows:1,people:true}, '出来事':{rows:1}, 'セリフ':{rows:1}}
};
function isHead(f){ return !!f && f.kind === 'h'; }
/* 基本設定の見出し。見出しから次の見出しまでの項目を1枚のカードにまとめる */
var MEMO_LABEL = '作品の背景・イメージなど';
function migHeads(list){
  if(!list || list.some(isHead)) return;
  var m = list.find(function(f){ return f.label === 'メモ'; }); if(m) m.label = MEMO_LABEL;
  [['作品の核','full',['ログライン','テーマ']], ['舞台','half',['時代','場所（舞台）']], ['主人公','half',['主人公の目的','主人公の障害']], ['メモ','full',[MEMO_LABEL,'類似作品・参考にした作品']]]
    .reverse().forEach(function(h){
      var i = list.findIndex(function(f){ return !isHead(f) && h[2].indexOf(f.label) >= 0; });
      if(i >= 0) list.splice(i, 0, {id:'h' + uid(), kind:'h', label:h[0], w:h[1]});
    });
}
function migLayout(sch){
  if(!sch) return;
  var b = sch.basic;
  if(b && b.length){
    var pos = [], known = [];
    b.forEach(function(f, i){ if(!isHead(f) && BASIC_ORDER.indexOf(f.label) >= 0){ pos.push(i); known.push(f); } });
    known.sort(function(x, y){ return BASIC_ORDER.indexOf(x.label) - BASIC_ORDER.indexOf(y.label); });
    pos.forEach(function(at, j){ b[at] = known[j]; });
  }
  ['basic','person','arc','card'].forEach(function(tab){
    (sch[tab] || []).forEach(function(f){
      if(f.rows || isHead(f)) return;
      var d = (LAYOUT[tab] || {})[f.label] || {};
      f.rows = d.rows || (f.multi ? (tab === 'basic' ? 3 : 2) : 1);
      f.w = d.w || (tab === 'basic' ? 'half' : (f.multi ? 'full' : 'fill'));
      f.nl = d.nl != null ? d.nl : (tab === 'person' && !!f.multi);
      if(d.people) f.people = true;
    });
  });
}
function defaultTemplate(){
  var t = {
    basic:[fld('ジャンル',0), fld('ログライン',1), fld('テーマ',1), fld('時代',0), fld('場所（舞台）',0), fld('主人公の目的',1), fld('主人公の障害',1), fld('メモ',1), fld('類似作品・参考にした作品',1)],
    person:[fld('年齢',0), fld('職業',0), fld('目的',0), fld('経歴',1), fld('ほかの人物との関係',1)],  /* 目的と経歴の順は migPerson12 で入れ替える */
    arc:[fld('始まりの状態',1), fld('変化のきっかけ',1), fld('終わりの状態',1)],
    card:[fld('場面',0), fld('登場人物',0), fld('出来事',1), fld('セリフ',1)]
  };
  migLayout(t);
  migHeads(t.basic);
  migBasic11(t);
  migPerson12(t);
  migPerson16(t);
  return t;
}
function migPerson(list){
  if(!list) return false;
  var labels = list.map(function(f){ return f.label; }).join('|');
  if(labels !== '年齢|職業|目的|ほかの人物との関係') return false;
  list[2].multi = false; list.splice(3, 0, fld('経歴', 1)); return true;
}
function migRef(list){
  if(!list || list.some(function(f){ return f.label === '類似作品・参考にした作品'; })) return;
  list.push(fld('類似作品・参考にした作品', 1));
}
function migMemo(list){
  if(!list || list.some(function(f){ return !isHead(f) && (f.label === 'メモ' || f.label === MEMO_LABEL); })) return;
  var i = list.findIndex(function(f){ return f.label === '類似作品・参考にした作品'; });
  if(i < 0) list.push(fld('メモ', 1)); else list.splice(i, 0, fld('メモ', 1));
}
function migEra(list, values){
  if(!list) return;
  var i = list.findIndex(function(f){ return f.label === '時代・舞台'; });
  if(i < 0 || list.some(function(f){ return f.label === '場所（舞台）' || f.label === '地（場所）'; })) return;
  var era = list[i]; era.label = '時代'; era.multi = false;
  var place = fld('場所（舞台）', 0);
  list.splice(i, 1);
  var g = list.find(function(f){ return f.label === 'ジャンル'; });
  var at = g ? list.indexOf(g) + 1 : 0;
  list.splice(at, 0, era, place);
  if(values){
    var v = String(values[era.id] || ''), parts = v.split('・');
    if(v.indexOf('\n') < 0 && parts.length === 2 && parts[0].trim() && parts[1].trim()){ values[era.id] = parts[0].trim(); values[place.id] = parts[1].trim(); }
  }
}
/* 基本設定の初期の行数を減らす（初期値のままの項目だけ） */
var ROWS13 = {'地（場所）':[5,3], '目的':[3,2], '障害':[3,2], '作品の背景・イメージなど':[5,3], '類似作品・参考にした作品':[5,3]};
function migRows13(sch){
  ((sch && sch.basic) || []).forEach(function(f){ var d = !isHead(f) && ROWS13[f.label]; if(d && f.rows === d[0]) f.rows = d[1]; });
}
/* 箱書きのカード：出来事とセリフの初期の行数を1行にする（初期値のままの項目だけ） */
function migCard14(sch){
  ((sch && sch.card) || []).forEach(function(f){ if((f.label === '出来事' || f.label === 'セリフ') && f.rows === 2) f.rows = 1; });
}
/* 基本設定・人物・アークの欄も、最初は1行で表示する（初期値のままの項目だけ） */
var ROWS15 = {basic:{'ログライン':3, 'テーマ':3, '地（場所）':3, '目的':2, '障害':2, '作品の背景・イメージなど':3, '類似作品・参考にした作品':3},
  person:{'経歴':2}, arc:{'始まりの状態':2, '変化のきっかけ':2, '終わりの状態':2}};
function migRows15(sch){
  if(!sch) return;
  Object.keys(ROWS15).forEach(function(tab){
    (sch[tab] || []).forEach(function(f){ if(!isHead(f) && ROWS15[tab][f.label] === f.rows) f.rows = 1; });
  });
}
/* 人物：経歴を目的の前に置く */
function migPerson12(sch){
  var l = sch && sch.person; if(!l) return;
  var a = l.findIndex(function(f){ return f.label === '目的'; }), b = l.findIndex(function(f){ return f.label === '経歴'; });
  if(a >= 0 && b > a){ var x = l[a]; l[a] = l[b]; l[b] = x; }
}
/* 人物：主人公と主要人物で項目を分ける（f.who）。目的・障害は基本設定の同じ項目と連動させる（f.link）。
   作品に使うときは、なくなる欄の内容を対応する欄へ移す。新しい欄のIDは端末ごとに変わらないよう固定の名前にする */
function linkField(list, kind){ return (list || []).find(function(f){ return !isHead(f) && f.link === kind; }); }
function visiblePF(w, p){ return (w.schema.person || []).filter(function(f){ return !f.who || f.who === p.role; }); }
function hasProfile(p){ return p.role === 'main' || p.role === 'major'; }
function migPerson16(sch, w){
  if(!sch) return;
  var b = sch.basic || (sch.basic = []);
  [['goal',['目的','主人公の目的']], ['obstacle',['障害','主人公の障害']]].forEach(function(x){
    if(linkField(b, x[0])) return;
    var bf = b.find(function(f){ return !isHead(f) && !f.link && x[1].indexOf(f.label) >= 0; }); if(bf) bf.link = x[0];
  });
  var l = sch.person; if(!l || l.some(function(f){ return f.who || f.link; })) return;
  function take(lab){ var i = l.findIndex(function(f){ return f.label === lab; }); return i >= 0 ? l.splice(i, 1)[0] : null; }
  function line(f, id, label, extra){ f = f || {id:id}; f.label = label; f.multi = true; f.rows = f.rows || 1; f.w = 'full'; f.nl = true; Object.keys(extra || {}).forEach(function(k){ f[k] = extra[k]; }); return f; }
  var age = take('年齢'), job = take('職業'), rel = take('ほかの人物との関係'), goal = take('目的'), bg = take('経歴'), rest = l.splice(0);
  if(job && job.w === 'full') job.w = 'fill';
  if(job) job.nl = false;
  rel = line(rel, 'f16relmain', '主要人物との関係', {who:'main'});
  var relM = line(null, 'f16relmajor', '主人公との関係', {who:'major'});
  goal = line(goal, 'f16goal', '目的', {who:'main', link:'goal'}); goal.rows = 1;
  var obst = line(null, 'f16obst', '障害', {who:'main', link:'obstacle'});
  bg = line(bg, 'f16bg', '背景・経歴');
  [age, job, rel, relM, goal, obst, bg].filter(Boolean).concat(rest).forEach(function(f){ l.push(f); });
  if(!w) return;
  var bgoal = linkField(b, 'goal'); w.basic = w.basic || {};
  (w.people || []).forEach(function(p){
    var v = p.values || (p.values = {});
    if(p.role === 'major' && v[rel.id]){ v[relM.id] = v[rel.id]; delete v[rel.id]; }
    var g = String(v[goal.id] || '').trim(); delete v[goal.id];
    if(!g) return;
    var cur = bgoal ? String(w.basic[bgoal.id] || '').trim() : null;
    if(p.role === 'main' && bgoal && !cur){ w.basic[bgoal.id] = g; return; }
    if(p.role === 'main' && cur === g) return;
    v[bg.id] = (String(v[bg.id] || '').trim() ? v[bg.id] + '\n' : '') + '目的：' + g;
  });
}
/* 基本設定の項目名を、見出しの中で通じる短い名前にする */
var BASIC_RENAME = {'時代':'天（時代）', '場所（舞台）':'地（場所）', '主人公の目的':'目的', '主人公の障害':'障害'};
function migBasic11(sch){
  ((sch && sch.basic) || []).forEach(function(f){
    if(isHead(f)) return;
    if(BASIC_RENAME[f.label]) f.label = BASIC_RENAME[f.label];
  });
}
function migMemoRows(sch){
  ((sch && sch.basic) || []).forEach(function(f){ if((f.label === 'メモ' || f.label === '類似作品・参考にした作品') && f.rows === 6) f.rows = 5; });
}
function migrateTemplates(){

    '<button type="button" class="icon-btn" id="btn-redo" data-act="redo" aria-label="やり直す" title="やり直す"' + (H.redo.length ? '' : ' disabled') + '>' + ICON.redo + '</button>' +
    '<button type="button" class="icon-btn" data-act="open-hist" aria-label="以前の版" title="以前の版">' + ICON.hist + '</button>' +
    '<span class="status' + (st.err ? ' err' : '') + '" id="status" role="status">' + esc(st.text) + '</span>' +
    '<button type="button" class="btn" data-act="pdf">PDF出力</button>' +
    '</div><div class="tabs-row"><nav class="tabs" aria-label="作品のタブ">' +
    tabs.map(function(t){ return '<button type="button" class="tab" data-act="tab" data-v="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + '</button>'; }).join('') +
    '</nav>' + boxInfo(w) + '</div></div></header>';
}

/* 箱書きを表示している間だけ、タブの行の右にシーンの件数と合計を出す */
function boxInfo(w){
  var ctx;
  if(S.tab === 'boxes' && w.kind !== 'serial') ctx = sceneCtx();
  else if(S.tab === 'episodes' && S.epSub === 'boxes'){
    var eps = epsOf(w); if(!eps.some(function(e){ return e.id === S.epId; })) S.epId = eps.length ? eps[0].id : null;
    if(!S.epId) return '';
    ctx = sceneCtx();
  } else return '';
  var all = ctx.list.reduce(function(a, x){ return a + (toInt(x.min, 0, 999) || 0); }, 0);
  return '<div class="tab-tools"><span class="tab-info">シーン ' + ctx.list.length + '件' + (all ? '・計 ' + all + '分（尺 ' + ctx.length + '分）' : '') + '</span>' +
    (ctx.list.length ? '<button type="button" class="btn tab-btn" data-act="copy-boxes">' + ICON.dup + '全シーンをコピー</button>' : '') + '</div>';
}

/* ---------- list ---------- */
function renderList(){
  var works = Object.keys(S.works).map(function(k){ return S.works[k]; })
    .filter(function(w){ return S.listFilter === 'all' || w.kind === S.listFilter; })
    .sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
  var total = Object.keys(S.works).length;
  var filters = [['all','すべて']].concat(KIND_ORDER.map(function(k){ return [k, KINDS[k].label]; }));
  var rows;
  if(total === 0){
    rows = '<div class="empty"><p>まだ作品がありません。「新しい作品」から、最初の作品を作ってください。</p><button type="button" class="btn primary" data-act="new-work">' + ICON.plus + '新しい作品</button></div>';
  } else if(works.length === 0){
    rows = '<div class="empty"><p>この種類の作品はまだありません。</p></div>';
  } else {
    rows = '<div class="wl-cols" aria-hidden="true"><div>作品名</div><div>種類</div><div>長さ</div><div style="text-align:right">最終更新</div></div><div class="work-rows">' +
      works.map(function(w){
        var len = w.kind === 'serial' ? '全' + (w.epOrder||[]).length + '話' : w.length + '分';
        return '<div class="work-row"><button type="button" class="work-open" data-act="open-work" data-id="' + w.id + '">' +
          '<span class="wt">' + esc(w.title || '無題の作品') + '</span><span class="kd">' + KINDS[w.kind].label + '</span><span class="ln">' + len + '</span><span class="dt">' + fmtDate(w.updatedAt) + '</span></button>' +
          '<button type="button" class="icon-btn" data-act="dup-work" data-id="' + w.id + '" aria-label="' + esc(w.title || '無題の作品') + 'を複製" title="複製">' + ICON.dup + '</button>' +
          '<button type="button" class="icon-btn del-far" data-act="delete-work" data-id="' + w.id + '" aria-label="' + esc(w.title || '無題の作品') + 'を削除">' + ICON.trash + '</button></div>';
      }).join('') + '</div>';
  }
  var backup = '<button type="button" class="btn" data-act="export">バックアップを保存</button>';
  var st = statusInfo();
  return '<header class="topbar"><div class="wrap list-w gut"><div class="topbar-in">' +
    '<div class="brand">Kousei</div><span class="spacer"></span>' +
    '<span class="status' + (st.err ? ' err' : '') + '" id="status" role="status">' + esc(st.text) + '</span>' +
    '<button type="button" class="btn" data-act="open-templates">ひな形を編集</button>' +
    '<button type="button" class="btn primary" data-act="new-work">' + ICON.plus + '新しい作品</button>' +
    '</div></div></header>' +
    '<main class="page gut"><div class="wrap list-w">' +
    '<div class="list-head"><h1 class="sr">作品一覧</h1><div class="seg" role="group" aria-label="作品の種類で絞り込む">' +
    filters.map(function(f){ return '<button type="button" data-act="list-filter" data-v="' + f[0] + '" aria-pressed="' + (S.listFilter === f[0]) + '">' + f[1] + '</button>'; }).join('') +
    '</div></div>' + rows +
    '<div class="list-tools">' +
    syncPanel() +
    '<section class="backup panel" aria-labelledby="bk-h"><h2 id="bk-h">バックアップ</h2>' +
    '<p>すべての作品とひな形を1つのファイルに保存します。アーティファクト版で保存したバックアップも読み込めます。</p>' +
    backup +
    '<label class="btn" for="import-file">バックアップを読み込む</label><input id="import-file" class="sr" type="file" accept=".json,application/json">' +
    '<button type="button" class="btn" data-act="open-hist">削除した作品を戻す</button>' +
    '</section>' +
    '</div>' +
    '<p class="foot">バージョン ' + VERSION + '　保存先：' + (Store.mode === 'db' ? 'この端末と、あなたのアカウント（MacとiPadで同期）' : 'この端末') + '<br>PDFの書体：Noto Sans JP（SIL Open Font License 1.1）</p>' +
    '</div></main>';
}

var syncBusy = false;
function syncPanel(){
  var body;
  if(!Store.configured){
    body = '<p>Firebaseの設定（firebase-config.js）が入っていないため、この端末だけに保存しています。</p>';
  } else if(!Store.authKnown){
    body = '<p>ログインの状態を確かめています…</p>';
  } else if(Store.user){
    var err = Store.ready && lastError && lastError.code === 'permission-denied'
      ? '<p class="err-text">このアカウントには同期の許可がありません。Firestoreのルールに書いたUIDと、ログインしたアカウントが同じか確かめてください。</p>' : '';
    body = '<p class="sync-who">ログイン中：' + esc(Store.user.email || '') + '</p>' + err +
      '<button type="button" class="btn" data-act="sign-out"' + (syncBusy ? ' disabled' : '') + '>ログアウト</button>';
  } else {
    body = '<p>脚本エディタと同じメールアドレスとパスワードでログインすると、MacとiPadの間で作品を同期できます。</p>' +
      '<div class="sync-form">' +
      '<label class="sr" for="si-mail">メールアドレス</label><input id="si-mail" class="in" type="email" autocomplete="username" placeholder="メールアドレス" required>' +
      '<label class="sr" for="si-pass">パスワード</label><input id="si-pass" class="in" type="password" autocomplete="current-password" placeholder="パスワード" required>' +
      '<button type="button" class="btn primary" data-act="sign-in"' + (syncBusy ? ' disabled' : '') + '>ログイン</button>' +
      '<button type="button" class="linkish" data-act="reset-pass">パスワードを忘れた場合</button>' +
      '</div>';
  }
  return '<section class="backup panel" aria-labelledby="sy-h"><h2 id="sy-h">同期</h2>' + body + '</section>';
}
function authError(e){
  var c = e && e.code || '';
  if(c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-login-credentials') return 'メールアドレスかパスワードが違います';
  if(c === 'auth/invalid-email') return 'メールアドレスの形が正しくありません';
  if(c === 'auth/too-many-requests') return '試行が多すぎるため、しばらく待ってからお試しください';
  if(c === 'auth/network-request-failed') return '通信できませんでした。接続を確かめてください';
  return 'ログインできませんでした';
}
/* ログイン欄はフォームにしない。フォームにすると、Safariがパスワードの自動入力のあとにログインまで済ませてしまうため（脚本エディタと同じ作り） */
function signInNow(){
  var mail = document.getElementById('si-mail').value.trim(), pass = document.getElementById('si-pass').value;
  if(!mail || !pass || !Store.auth) return;
  syncBusy = true; render();
  FB.signInWithEmailAndPassword(Store.auth, mail, pass).then(function(){ syncBusy = false; toast('ログインしました'); render(); },
    function(err){ syncBusy = false; render(); var m = document.getElementById('si-mail'); if(m) m.value = mail; toast(authError(err)); });
}
function signOutNow(){
  flushAll();
  syncBusy = true; render();
  FB.signOut(Store.auth).then(function(){ syncBusy = false; toast('ログアウトしました。この端末の作品はそのまま残ります'); render(); },
    function(){ syncBusy = false; render(); toast('ログアウトできませんでした'); });
}
function resetPass(){
  var el = document.getElementById('si-mail'), mail = el ? el.value.trim() : '';
  if(!mail){ toast('メールアドレスを入力してから押してください'); if(el) el.focus(); return; }
  FB.sendPasswordResetEmail(Store.auth, mail).then(function(){ toast('パスワードを再設定するメールを送りました'); }, function(err){ toast(authError(err)); });
}

/* ---------- basic ---------- */
function renderBasic(w){
  var lenText = w.kind === 'serial'
    ? '全' + (w.epOrder||[]).length + '話（基本の1話' + w.baseLength + '分）'
    : w.length + '分';
  var cell = function(f){
    return '<div class="field ' + fwClass(f.w) + '"><label class="fl" for="b-' + f.id + '">' + esc(f.label) + '</label>' +
      fieldInput('W|basic|' + f.id, getPath(w, ['basic', f.id]), f, 'b-' + f.id) + '</div>';
  };
  var title = '<div class="field fw-title"><label class="fl" for="b-title">タイトル</label>' + inputFor('W|title', w.title, 'line', 'b-title') + '</div>';
  var sch = w.schema.basic || [], hasH = sch.some(isHead), headEnd = 0;
  if(hasH) while(headEnd < sch.length && !isHead(sch[headEnd])) headEnd++;
  else while(headEnd < sch.length && !sch[headEnd].nl && sch[headEnd].w !== 'full') headEnd++;
  var groups = [], cur = null;
  sch.slice(headEnd).forEach(function(f){
    if(isHead(f)){ cur = {h:f, fields:[]}; groups.push(cur); return; }
    if(!cur){ cur = {h:null, fields:[]}; groups.push(cur); }
    cur.fields.push(f);
  });
  var len = w.kind === 'serial'
    ? '<div class="field f-len"><span class="fl">尺</span><div class="readout">' + esc(lenText) + '</div></div>'
    : '<div class="field f-len"><label class="fl" for="b-len">尺</label><div class="num"><input id="b-len" class="in" type="text" inputmode="numeric" data-change="w-len" value="' + w.length + '"><span>分</span></div></div>';
  var cards = groups.map(function(g){
    var half = g.h && g.h.w === 'half';
    var fields = half ? g.fields.map(function(f){ return Object.assign({}, f, {w:'full', nl:true}); }) : g.fields;
    return '<section class="bcard' + (half ? '' : ' wide') + '"' + (g.h ? ' aria-labelledby="bh-' + g.h.id + '"' : '') + '>' +
      (g.h ? '<h2 class="bcard-h" id="bh-' + g.h.id + '">' + esc(g.h.label) + '</h2>' : '') +
      (fields.length ? flowRows(fields, cell) : '<p class="sub-l">この見出しには項目がありません。「ひな形を編集」で項目を追加できます。</p>') + '</section>';
  }).join('');
  return '<main class="page gut basic-b"><div class="wrap"><div class="bhead">' + flowRows(sch.slice(0, headEnd), cell, [title], [len]) + '</div>' +
    (cards ? '<div class="bgrid">' + cards + '</div>' : '') + '</div></main>';
}

/* ---------- people ---------- */
var ROLES = [['main','主人公'],['major','主要人物'],['','指定なし']];
function roleLabel(r){ return r === 'main' ? '主人公' : r === 'major' ? '主要人物' : ''; }
function roleChip(r){ return r ? '<span class="role-chip ' + r + '">' + roleLabel(r) + '</span>' : ''; }
function roleRank(p){ return p.role === 'main' ? 0 : p.role === 'major' ? 1 : 2; }
function sortPeople(arr){ return arr.map(function(p,i){ return {p:p,i:i}; }).sort(function(a,b){ return (roleRank(a.p) - roleRank(b.p)) || (a.i - b.i); }).map(function(x){ return x.p; }); }
function renderPeople(w){
  w.people = sortPeople(w.people);
  if(!w.people.some(function(p){ return p.id === S.personId; })) S.personId = w.people.length ? w.people[0].id : null;
  var list = w.people.map(function(p, idx){
    var sub = '';
    var firstLine = (w.schema.person || [])[1] || (w.schema.person || [])[0];
    if(firstLine) sub = getPath(p, ['values', firstLine.id]);
    var item = '<button type="button" class="side-item" data-act="pick-person" data-id="' + p.id + '"' + (p.id === S.personId ? ' aria-current="true"' : '') + '>' +
      '<span class="two"><span data-pname="' + p.id + '">' + esc(p.name || '名前未設定') + '</span>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' +
      roleChip(p.role) + '</button>';
    if(p.id !== S.personId) return item;
    var prev = w.people[idx-1], next = w.people[idx+1], nm = esc(p.name || '名前未設定');
    var canUp = prev && roleRank(prev) === roleRank(p), canDown = next && roleRank(next) === roleRank(p);
    if(!canUp && !canDown) return item;
    return '<div class="side-row">' + item + '<div class="side-mv">' +
      '<button type="button" class="icon-btn" data-act="person-up" data-id="' + p.id + '" aria-label="' + nm + 'を上へ"' + (canUp ? '' : ' disabled') + '>' + ICON.up + '</button>' +
      '<button type="button" class="icon-btn" data-act="person-down" data-id="' + p.id + '" aria-label="' + nm + 'を下へ"' + (canDown ? '' : ' disabled') + '>' + ICON.down + '</button></div></div>';
  }).join('');
  var side = '<aside class="side narrow" aria-label="人物の一覧"><div class="side-top"><b>人物</b><span>' + w.people.length + '人</span></div>' + list +
    '<button type="button" class="add-dash" data-act="add-person" style="margin-top:6px">' + ICON.plus + '人物を追加</button>' +
    (w.people.length ? '<button type="button" class="btn quiet side-copy" data-act="copy-people">一覧をコピー</button>' : '') + '</aside>';
  var main;
  var p = w.people.find(function(x){ return x.id === S.personId; });
  if(!p){
    main = '<div class="empty"><p>まだ人物がいません。「人物を追加」から登場人物を登録してください。</p></div>';
  } else {
    var arc;
    if(p.arc){
      /* アークの欄は、始まりから終わりへ矢印でつないで横に並べる（5つ以上のときと狭い画面では縦） */
      var arcF = w.schema.arc || [];
      var arcCells = arcF.map(function(f){
        return '<div class="field"><label class="fl" for="a-' + p.id + '-' + f.id + '">' + esc(f.label) + '</label>' +
          fieldInput('P:' + p.id + '|arc|' + f.id, getPath(p, ['arc', f.id]), f, 'a-' + p.id + '-' + f.id) + '</div>';
      }).join('<div class="arc-ar">' + ICON.arrow + '</div>');
      arc = '<section class="bcard" aria-labelledby="arc-h-' + p.id + '"><div class="bcard-top"><h2 class="bcard-h" id="arc-h-' + p.id + '">アーク</h2>' +
        '<button type="button" class="link-btn" data-act="remove-arc" data-id="' + p.id + '">アークを外す</button></div>' +
        (arcF.length ? '<div class="arc-flow' + (arcF.length > 4 ? ' tall' : '') + '">' + arcCells + '</div>' : '<p class="sub-l">アークの項目がありません。「ひな形を編集」で追加できます。</p>') + '</section>';
    } else {
      arc = '<section class="bcard" aria-labelledby="arc-h-' + p.id + '"><div class="bcard-top"><h2 class="bcard-h" id="arc-h-' + p.id + '">アーク</h2>' +
        '<button type="button" class="btn" data-act="add-arc" data-id="' + p.id + '">' + ICON.plus + 'アークを追加</button></div></section>';
    }
    var cell = function(f){
      /* 目的・障害は基本設定の同じ項目をそのまま読み書きする */
      var bf = f.link && linkField(w.schema.basic, f.link);
      return '<div class="field ' + fwClass(f.w) + '"><label class="fl" for="pv-' + f.id + '">' + esc(f.label) + (bf ? '<span class="fl-link">基本設定と連動</span>' : '') + '</label>' +
        (bf ? fieldInput('W|basic|' + bf.id, getPath(w, ['basic', bf.id]), f, 'pv-' + f.id) : fieldInput('P:' + p.id + '|values|' + f.id, getPath(p, ['values', f.id]), f, 'pv-' + f.id)) + '</div>';
    };
    var nameCell = '<div class="field p-nm"><label class="fl" for="p-name">名前</label>' + inputFor('P:' + p.id + '|name', p.name, 'line', 'p-name') + '</div>';
    var roleCell = '<div class="field f-role"><span class="fl" id="role-h">役割</span><div class="seg" role="group" aria-labelledby="role-h">' +
      ROLES.map(function(r){ return '<button type="button" data-act="set-role" data-id="' + p.id + '" data-v="' + r[0] + '" aria-pressed="' + ((p.role || '') === r[0]) + '">' + r[1] + '</button>'; }).join('') +
      '</div></div>';
    var pf = visiblePF(w, p);
    /* プロフィールとアークは、主人公と主要人物にだけ出す（指定なしの人物に書いた内容は消さずに残す） */
    main = '<div class="phead">' + nameCell + roleCell + '</div>' + (hasProfile(p) ?
      '<section class="bcard" aria-labelledby="pf-h-' + p.id + '"><h2 class="bcard-h" id="pf-h-' + p.id + '">プロフィール</h2>' +
      (pf.length ? flowRows(pf, cell) : '<p class="sub-l">プロフィールの項目がありません。「ひな形を編集」で追加できます。</p>') + '</section>' + arc
      : '<p class="sub-l p-none">プロフィールとアークは、役割を「主人公」か「主要人物」にすると表示されます。</p>') + '<div><button type="button" class="link-btn p-del" data-act="delete-person" data-id="' + p.id + '">この人物を削除</button></div>';
  }
  return '<main class="page gut basic-b people-a"><div class="wrap"><div class="split">' + side + '<div class="side-main">' + main + '</div></div></div></main>';
}

/* ---------- plot ---------- */
function plotBlock(root, obj, L, withHook){
  var r = function(a,b){ return mins(L,a) + '〜' + mins(L,b) + '分'; };
  function ta(k, cls, label){ return '<textarea id="pl-' + k + '" class="ta fit ' + (cls||'') + '" rows="14" data-bind="' + root + '|plot|' + k + '"' + (label ? ' aria-label="' + label + 'の内容"' : '') + '>' + esc(obj.plot[k]) + '</textarea>'; }
  function point(k, label){ return '<div class="point"><label for="pl-' + k + '">' + ICON.dia + label + '</label><textarea id="pl-' + k + '" class="ta fit2" rows="2" data-bind="' + root + '|plot|' + k + '">' + esc(obj.plot[k]) + '</textarea></div>'; }
  /* 幕の色の帯を、それぞれのカードの見出しにする */
  function hd(cls, name, range){ return '<div class="pcol-hd ' + cls + '"><b>' + name + '</b><span>' + range + '</span></div>'; }
  return '<div class="plot-grid pgrid">' +
    '<section class="col pcol" aria-label="第一幕">' + hd('b1','第一幕', r(0,.25)) + '<div class="pcol-bd">' + ta('a1','grow','第一幕') + point('pp1','プロットポイント1') + '</div></section>' +
    '<section class="col pcol" aria-label="第二幕">' + hd('b2','第二幕', r(.25,.75)) + '<div class="pcol-bd"><div class="act2-in">' +
      '<div class="half"><div class="psub"><b>前半</b><span>' + r(.25,.5) + '</span></div>' + ta('a2a','grow','第二幕前半') + point('mp','ミッドポイント') + '</div>' +
      '<div class="half"><div class="psub"><b>後半</b><span>' + r(.5,.75) + '</span></div>' + ta('a2b','grow','第二幕後半') + point('pp2','プロットポイント2') + '</div>' +
    '</div></div></section>' +
    '<section class="col pcol" aria-label="第三幕">' + hd('b3','第三幕', r(.75,1)) + '<div class="pcol-bd">' + ta('a3','grow','第三幕') +
      (withHook ? '<div class="hook"><label for="pl-hook">次の話への引き</label><textarea id="pl-hook" class="ta fit2" rows="2" data-bind="' + root + '|plot|hook">' + esc(obj.plot.hook) + '</textarea></div>' : '') +
    '</div></section></div>';
}

/* ---------- boxes ---------- */
/* 段の色：幕はプロット画面と同じ色、プロットポイントは赤 */
function segBand(seg){ return seg.point ? 'pt' : (seg.k === 'a1' ? 'b1' : seg.k === 'a3' ? 'b3' : 'b2'); }
function segMark(seg){ return seg.point ? '<span class="mk">' + ICON.dia + '</span>' : '<span class="mk sq ' + segBand(seg) + '"></span>'; }
function sortScenes(list){
  return list.map(function(s,i){ return {s:s,i:i}; }).sort(function(a,b){ return (SEG_INDEX[a.s.seg]-SEG_INDEX[b.s.seg]) || (a.i-b.i); }).map(function(x){ return x.s; });
}
function sidePlot(w, ctx){
  if(S.boxFilter === 'all') return '<p class="side-plot-note">段を選ぶと、その段のプロットがここに表示されます。</p>';

function renderModal(focus){

function openModal(m){ S.modal = m; renderModal(); }
function closeModal(){ S.modal = null; renderModal(); }
function askConfirm(title, msg, ok, danger, onOk){ openModal({type:'confirm', title:title, msg:msg, ok:ok, danger:danger, onOk:onOk}); }
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && S.modal && !S.modal.busy) closeModal(); });

var toastTimer = null;
function toast(msg, ms){

  r.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ r.innerHTML = ''; }, ms || 3200);

/* ---------- main render ---------- */
function render(){
  var app = document.getElementById('app'), html = '';
  if(S.view === 'list') html = renderList();
  else if(S.view === 'templates') html = renderTemplates();
  else if(S.view === 'work'){
    var w = curWork();
    if(!w){ S.view = 'list'; return render(); }
    html = workHeader(w);
    if(S.tab === 'basic') html += renderBasic(w);
    else if(S.tab === 'people') html += renderPeople(w);
    else if(S.tab === 'plot') html += '<main class="page gut"><div class="wrap">' + plotBlock('W', w, w.length, false) + '</div></main>';
    else if(S.tab === 'boxes') html += '<main class="page gut"><div class="wrap">' + boxesBlock(w, sceneCtx()) + '</div></main>';
    else if(S.tab === 'series') html += renderSeries(w);
    else if(S.tab === 'episodes') html += renderEpisodes(w);
  }
  /* 上部のメニューの枠は作り直さず、中身だけを入れ替える（iPadOS 26 のホーム画面のアプリでは、
     上端の無地の帯が一度でも消えると、画面の上端がぼかされるため） */
  var top = document.getElementById('topbar'), hm = /^<header class="topbar">([\s\S]*?)<\/header>/.exec(html);
  if(hm){ top.innerHTML = hm[1]; html = html.slice(hm[0].length); }
  app.innerHTML = html;
  fitAll(app);
  if(syncWait) applyWaitRO();
  try{ localStorage.setItem(LOCAL_KEY + '-ui', JSON.stringify({tplKind:S.tplKind, listFilter:S.listFilter})); }catch(e){}
}
function autosize(el){ el.style.height = ''; if(!el.value) return; if(el.scrollHeight > el.clientHeight + 2) el.style.height = (el.scrollHeight + 2) + 'px'; }
function autosizeMin(el){ el.style.minHeight = ''; if(el.scrollHeight > el.clientHeight + 2) el.style.minHeight = (el.scrollHeight + 2) + 'px'; }
function fitOne(el){
  if(el.classList.contains('fit')){ document.querySelectorAll('textarea.fit').forEach(autosizeMin); return; }
  if(el.classList.contains('auto') || el.classList.contains('one') || el.classList.contains('long') || el.classList.contains('fit2')) autosize(el);
}
function fitAll(root){
  root.querySelectorAll('textarea.auto, textarea.one, textarea.long, textarea.fit2').forEach(autosize);
  root.querySelectorAll('textarea.fit').forEach(autosizeMin);
}
window.addEventListener('resize', function(){ fitAll(document); });
function focusSoon(sel){ setTimeout(function(){ var el = document.querySelector(sel); if(el){ el.focus(); if(el.scrollIntoView) el.scrollIntoView({block:'center', behavior:'smooth'}); } }, 30); }

/* ---------- actions ---------- */
function readModal(ids){ var o = {}; ids.forEach(function(id){ var el = document.getElementById(id); if(el) o[id] = el.value; }); return o; }

function createWork(){
  var m = S.modal, v = readModal(['nw-title','nw-len','nw-eps','nw-base']);
  m.title = v['nw-title'] || ''; if(v['nw-len'] != null) m.len = v['nw-len']; if(v['nw-eps'] != null) m.eps = v['nw-eps']; if(v['nw-base'] != null) m.base = v['nw-base'];
  var tpl = clone(S.templates[m.kind]);
  var w = {v:1, id:'w-' + uid(), title:m.title.trim() || '無題の作品', kind:m.kind, createdAt:Date.now(), updatedAt:Date.now(),
    schema:tpl, basic:{}, people:[]};
  /* ひな形は最新の形なので、古い形を直す処理は不要（済みの印を付けておく） */
  ['mig2','mig3','mig4','mig6','mig7','mig8','mig9','mig10','mig11','mig12','mig13','mig14','mig15','mig16'].forEach(function(k){ w[k] = true; });
  if(m.kind === 'serial'){
    var n = toInt(m.eps, 1, 100), base = toInt(m.base, 1, 600);
    if(!n || !base){ m.err = '話数と基本の1話の長さを数字で入力してください。'; renderModal(false); return; }
    w.baseLength = base; w.epOrder = [];
    w.series = {a1:{text:'',eps:[]}, a2:{text:'',eps:[]}, a3:{text:'',eps:[]}, pp1:'', mp:'', pp2:''};
    S.episodes[w.id] = {};
    for(var i=0;i<n;i++){ var ep = newEp(base); S.episodes[w.id][ep.id] = ep; w.epOrder.push(ep.id); }
    S.works[w.id] = w;
    epsOf(w).forEach(function(ep){ saveEpSoon(w, ep); });
    S.tab = 'basic';
  } else {
    var L = toInt(m.len, 1, 600);
    if(!L){ m.err = '長さを分単位の数字で入力してください。'; renderModal(false); return; }
    w.length = L; w.plot = emptyPlot(false); w.scenes = [];
    S.works[w.id] = w;
    S.tab = 'basic';
  }
  saveWorkSoon(w);
  S.workId = w.id; S.view = 'work'; S.personId = null; S.boxFilter = 'all'; S.epId = null; S.epSub = 'plot'; histReset();
  closeModal(); render(); window.scrollTo(0,0); focusSoon('#b-title');
}
function newEp(len){ return {id:'e-' + uid(), length:len, plot:emptyPlot(true), scenes:[]}; }

function addScene(seg){
  var w = curWork(), ctx = sceneCtx();
  if(!seg){ seg = ctx.list.length ? ctx.list[ctx.list.length-1].seg : 'a1'; }
  var sc = {id:'s' + uid(), seg:seg, values:{}};
  checkpoint();
  ctx.owner.scenes = sortScenes(ctx.list.concat([sc]));
  ctx.save(); render();
  var first = (w.schema.card || [])[0];
  focusSoon(first ? '#s-' + sc.id + '-' + first.id : '#card-' + sc.id);
}
function moveScene(id, dir){
  var ctx = sceneCtx(), list = ctx.list.slice(), i = list.findIndex(function(s){ return s.id === id; }), j = i + dir;
  if(i < 0 || j < 0 || j >= list.length || list[j].seg !== list[i].seg) return;
  checkpoint();
  var t = list[i]; list[i] = list[j]; list[j] = t;
  ctx.owner.scenes = list; ctx.save(); render();
  focusSoon('.grip[data-id="' + id + '"]');
}

async function exportBackup(){
  if(!S.dl) return;
  flushAll();
  var data = {app:'kyakuhon-kousou', version:VERSION, exportedAt:new Date().toISOString(), templates:S.templates,
    works:Object.keys(S.works).map(function(id){ var w = clone(S.works[id]); if(w.kind === 'serial') w.episodes = epsOf(S.works[id]).map(clone); return w; })};
  var d = new Date(), name = 'Kousei-backup-' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.json';
  try{ await S.dl.save({filename:name, data:JSON.stringify(data, null, 1)}); toast('バックアップを保存しました'); }
  catch(e){ if(e && e.code !== 'declined') toast('バックアップを保存できませんでした'); }
}
function importBackup(file){
  var reader = new FileReader();
  reader.onload = function(){
    var data = null;
    try{ data = JSON.parse(reader.result); }catch(e){}
    if(!data || data.app !== 'kyakuhon-kousou' || !Array.isArray(data.works)){ toast('このファイルはKouseiのバックアップではありません'); return; }
    askConfirm('バックアップを読み込む', '作品' + data.works.length + '件と、ひな形を読み込みます。同じ作品がある場合は、バックアップの内容で上書きします。', '読み込む', false, function(){
      if(data.templates) { S.templates = data.templates; migrateTemplates(); saveTemplatesSoon(); }
      data.works.forEach(function(w){
        var eps = w.episodes; delete w.episodes;
        S.works[w.id] = w;
        delete w.rev; delete w.dev; migrateWork(w);
        if(w.kind === 'serial'){ S.episodes[w.id] = {}; (eps || []).forEach(function(ep){ S.episodes[w.id][ep.id] = ep; markEp(w, ep.id); }); }
        saveWorkQuiet(w);
      });
      closeModal(); render(); toast('バックアップを読み込みました');
    });
  };
  reader.readAsText(file);
}

document.addEventListener('change', function(e){
  var el = e.target;
  if(el.id === 'import-file' && el.files && el.files[0]){ importBackup(el.files[0]); el.value = ''; return; }
  var a = el.dataset && el.dataset.change; if(!a) return;
  var w = curWork();
  if(a === 'scene-seg'){
    var ctx = sceneCtx(), sc = ctx.list.find(function(s){ return s.id === el.dataset.id; }); if(!sc) return;
    checkpoint(); sc.seg = el.value;
    var rest = ctx.list.filter(function(s){ return s !== sc; });
    ctx.owner.scenes = sortScenes(rest.concat([sc]));
    ctx.save(); render(); focusSoon('#seg-' + sc.id);
  } else if(a === 'w-len'){
    var wl = toInt(el.value, 1, 600);
    if(!wl){ el.value = w.length; toast('尺は1〜600の数字（分）で入力してください'); return; }
    el.value = wl;
    if(wl === w.length) return;
    checkpoint(); w.length = wl; saveWorkSoon(w);
    var mt = document.querySelector('.topbar .meta'); if(mt) mt.textContent = '（' + workMeta(w) + '）';
  } else if(a === 'ep-len'){
    var ep = S.episodes[w.id][el.dataset.id], n = toInt(el.value, 1, 600);
    if(!n){ el.value = ep.length; return; }
    if(n !== ep.length) checkpoint();
    ep.length = n; saveEpSoon(w, ep);
    el.value = n; el.closest('.ep-len').classList.toggle('changed', n !== w.baseLength);
  } else if(a === 'tpl-w' || a === 'tpl-rows' || a === 'tpl-nl' || a === 'tpl-people' || a === 'tpl-who'){
    var f = S.templates[el.dataset.k][el.dataset.t].find(function(x){ return x.id === el.dataset.id; });
    if(!f) return;
    if(a === 'tpl-w') f.w = el.value;
    else if(a === 'tpl-rows'){ f.rows = toInt(el.value, 1, 30) || 1; el.value = f.rows; }
    else if(a === 'tpl-nl') f.nl = el.checked;
    else if(a === 'tpl-who'){ if(el.value) f.who = el.value; else delete f.who; }
    else f.people = el.checked;
    saveTemplatesSoon();
  } else if(a === 'scene-min'){
    var cm = sceneCtx(), scm = cm.list.find(function(x){ return x.id === el.dataset.id; }); if(!scm) return;
    var nm = toInt(el.value, 0, 999); scm.min = nm == null ? '' : String(nm); cm.save(); renderKeep();
  } else if(a === 'as-check'){
    S.modal.sel[el.value] = el.checked;
  } else if(a === 'pdf-check'){
    S.modal.sel[el.value] = el.checked;
  }
});

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if(!el) return;
  var a = el.dataset.act, id = el.dataset.id, v = el.dataset.v, w = curWork();
  if(a === 'overlay'){ if(e.target === el && !(S.modal && S.modal.busy)) closeModal(); return; }
  switch(a){
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'go-list': flushAll(); histReset(); S.view = 'list'; render(); window.scrollTo(0,0); break;
    case 'list-filter': S.listFilter = v; render(); break;
    case 'open-work':
      S.workId = id; S.view = 'work'; S.tab = 'basic'; S.personId = null; S.boxFilter = 'all'; S.epId = null; S.epSub = 'plot';
      histReset(); render(); window.scrollTo(0,0);
      histSave(snapOf(id), 'open'); histMark(id); break;
    case 'open-hist': openHist(S.view === 'work' ? S.workId : null); break;
    case 'hist-pick': S.modal.sel = S.modal.sel === Number(v) ? null : Number(v); renderModal(false); break;
    case 'hist-restore': histRestore(Number(v)); break;
    case 'hist-dead': S.modal.back = S.modal.doc && S.works[S.modal.doc] ? S.modal.doc : S.modal.back; S.modal.doc = v; S.modal.sel = null; renderModal(false); break;
    case 'hist-back': S.modal.doc = S.modal.back; S.modal.back = null; S.modal.sel = null; renderModal(false); break;
    case 'delete-work':
      var dw = S.works[id];
      askConfirm('作品を削除', '「' + (dw.title || '無題の作品') + '」を削除します。削除してから30日間は、この端末の「以前の版」から作り直せます。', '削除', true, function(){
        deleteWorkEverywhere(id); closeModal(); render(); toast('作品を削除しました');
      });
      break;
    case 'dup-work':
      var src = S.works[id]; if(!src) break;
      flushAll();
      var nw = clone(src), nid = 'w-' + uid();
      nw.id = nid; nw.title = (src.title || '無題の作品') + '（複製）'; nw.createdAt = Date.now(); delete nw.rev; delete nw.dev;
      S.works[nid] = nw;
      if(src.kind === 'serial'){ S.episodes[nid] = clone(S.episodes[id] || {}); Object.keys(S.episodes[nid]).forEach(function(eid){ markEp(nw, eid); }); }
      saveWorkSoon(nw); render(); toast('「' + nw.title + '」を作りました'); break;
    case 'open-search': openModal({type:'search', q:S.lastQ || ''}); break;
    case 'search-go': goSearchHit(+el.dataset.i); break;
    case 'pick-name':
      var tgt = document.getElementById(el.dataset.target); if(!tgt) break;
      var pname = el.dataset.name, curv = tgt.value;
      if(curv.split(/[、,，・\s]+/).filter(Boolean).indexOf(pname) >= 0){ tgt.focus(); break; }
      tgt.value = curv.replace(/\s+$/, '') + (curv.trim() ? '、' : '') + pname;
      tgt.dispatchEvent(new Event('input', {bubbles:true}));
      tgt.focus(); break;
    case 'new-work':
      openModal({type:'new', kind:'single', title:'', len:'', eps:10, base:60}); break;
    case 'nw-kind':
      var vals = readModal(['nw-title','nw-len','nw-eps','nw-base']), m = S.modal;
      m.title = vals['nw-title'] || ''; if(vals['nw-eps'] != null) m.eps = vals['nw-eps']; if(vals['nw-base'] != null) m.base = vals['nw-base'];
      m.kind = v; m.err = '';
      m.len = KINDS[v].def == null ? '' : KINDS[v].def;
      renderModal(false); break;
    case 'nw-create': createWork(); break;
    case 'close-modal': closeModal(); break;
    case 'confirm-ok': var fn = S.modal.onOk; if(fn) fn(); break;
    case 'open-templates': S.view = 'templates'; render(); window.scrollTo(0,0); break;
    case 'export': exportBackup(); break;
    case 'sign-out': signOutNow(); break;
    case 'reset-pass': resetPass(); break;
    case 'sign-in': signInNow(); break;

    case 'tab': flushAll(); S.tab = v; render(); window.scrollTo(0,0); break;

    case 'pick-person': S.personId = id; render(); break;
    case 'person-up': case 'person-down':
      var pl = sortPeople(w.people), pi = pl.findIndex(function(x){ return x.id === id; }), pj = pi + (a === 'person-up' ? -1 : 1);
      if(pi < 0 || pj < 0 || pj >= pl.length || roleRank(pl[pi]) !== roleRank(pl[pj])) break;
      checkpoint(); var tmp = pl[pi]; pl[pi] = pl[pj]; pl[pj] = tmp; w.people = pl; saveWorkSoon(w); render();
      focusSoon('[data-act="' + a + '"][data-id="' + id + '"]:not([disabled]), [data-act="pick-person"][data-id="' + id + '"]'); break;
    case 'set-role':
      var rp2 = w.people.find(function(x){ return x.id === id; }); if(!rp2) break;
      checkpoint(); rp2.role = v;
      w.people = sortPeople(w.people.filter(function(x){ return x !== rp2; }).concat([rp2]));
      saveWorkSoon(w); render(); focusSoon('[data-act="set-role"][data-v="' + v + '"]'); break;
    case 'add-person':
      var p = {id:'p' + uid(), name:'', role:'', values:{}, arc:null};
      checkpoint(); w.people.push(p); S.personId = p.id; saveWorkSoon(w); render(); focusSoon('#p-name'); break;
    case 'delete-person':
      checkpoint();
      w.people = w.people.filter(function(x){ return x.id !== id; }); S.personId = null; saveWorkSoon(w); render();
      toast('人物を削除しました。「元に戻す」で戻せます'); break;
    case 'add-arc':
      var ap = w.people.find(function(x){ return x.id === id; }); checkpoint(); ap.arc = {}; saveWorkSoon(w); render();
      var fa = (w.schema.arc || [])[0]; if(fa) focusSoon('#a-' + id + '-' + fa.id); break;
    case 'remove-arc':
      var rp = w.people.find(function(x){ return x.id === id; }), hadArc = hasContent(rp.arc);
      checkpoint(); rp.arc = null; saveWorkSoon(w); render();
      if(hadArc) toast('アークを外しました。「元に戻す」で内容ごと戻せます');
      break;

    case 'box-filter': S.boxFilter = v; render(); break;
    case 'add-scene': addScene(v); break;
    case 'scene-up': moveScene(id, -1); break;
    case 'scene-down': moveScene(id, 1); break;
    case 'scene-del':
      var ctx = sceneCtx();
      checkpoint(); ctx.owner.scenes = ctx.list.filter(function(s){ return s.id !== id; }); ctx.save(); render();

/* ---------- drag to reorder scenes ---------- */
var drag = null;

function findDrop(){
  clearDropMarks(); drag.target = null; drag.pos = null; drag.grp = null;
  var el = document.elementFromPoint(drag.x, drag.y); if(!el) return;
  var tc = el.closest('.card');
  if(tc && tc !== drag.card){
    var r = tc.getBoundingClientRect();
    drag.target = tc.dataset.id; drag.pos = drag.x < r.left + r.width / 2 ? 'before' : 'after';
    tc.classList.add(drag.pos === 'before' ? 'drop-before' : 'drop-after'); return;

  var rest = copy.filter(function(x){ return x !== sc; });

    var t = rest.find(function(x){ return x.id === d.target; }); if(!t) return;
    sc.seg = t.seg; rest.splice(rest.indexOf(t) + (d.pos === 'after' ? 1 : 0), 0, sc);
