<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>構成プランナー</title>
<meta name="theme-color" content="#F5F6F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="構成プランナー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" id="touchIcon" href="icon-180.png">
<script>
/* ホーム画面のアイコン：iPadはホーム画面に追加したときに1回だけアイコンを取り込む。
   そのときの外観がダークなら黒背景に白文字、ライトなら白背景に黒文字のアイコンを使う */
(function(){
  var l=document.getElementById('touchIcon'), m=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  function u(){ l.href=(m&&m.matches)?'icon-180-dark.png':'icon-180.png'; }
  u(); if(m){ if(m.addEventListener) m.addEventListener('change',u); else if(m.addListener) m.addListener(u); }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap">
<style>
/* Layout: sticky work header + tab strip, content in a centered 1440px column; plot uses a 1:2:1 grid that mirrors screen time. */
:root{
  --bg:#F5F6F6; --surface:#FCFCFB; --surface2:#F5F6F6; --sunken:#ECEEEE; --bar:#F5F6F6;
  --fg:#1D2224; --fg2:#3A4244; --muted:#5C6668; --line:#CDD2D3; --line2:#C3C8C9;
  --accent:#1D2224; --accent-strong:#1D2224; --accent-weak:#E6E9E9; --on-accent:#FCFCFB; --mark:#B23F27;
  --act1:#D4D7D8; --act1-fg:#1D2224; --act2:#5C6668; --act2-fg:#FCFCFB; --act3:#AEB4B5; --act3-fg:#1D2224;
  --point-bg:#F8EFEB; --point-line:#E0BCAF; --point-fg:#8E3420; --point-mark:#B23F27;
  --input-bg:#FCFCFB; --danger:#B3261E; --danger-weak:#FBE9E7; --overlay:rgba(29,34,36,.5); --shadow:rgba(29,34,36,.16);
  --f-body:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
  --f-title:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131718; --surface:#1E2325; --surface2:#181D1E; --sunken:#262C2E; --bar:#131718;
  --fg:#E7E4DD; --fg2:#C9CCC8; --muted:#98A2A4; --line:#343C3E; --line2:#3E4749;
  --accent:#E7E4DD; --accent-strong:#E7E4DD; --accent-weak:#2A3133; --on-accent:#131718; --mark:#E5835F;
  --act1:#343C3E; --act1-fg:#E7E4DD; --act2:#5C6668; --act2-fg:#F0EEE9; --act3:#454E50; --act3-fg:#E7E4DD;
  --point-bg:#33241E; --point-line:#6E4A3C; --point-fg:#F0B49C; --point-mark:#E5835F;
  --input-bg:#181D1E; --danger:#F2B8B5; --danger-weak:#3A1F1E; --overlay:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#131718; --surface:#1E2325; --surface2:#181D1E; --sunken:#262C2E; --bar:#131718;
  --fg:#E7E4DD; --fg2:#C9CCC8; --muted:#98A2A4; --line:#343C3E; --line2:#3E4749;
  --accent:#E7E4DD; --accent-strong:#E7E4DD; --accent-weak:#2A3133; --on-accent:#131718; --mark:#E5835F;
  --act1:#343C3E; --act1-fg:#E7E4DD; --act2:#5C6668; --act2-fg:#F0EEE9; --act3:#454E50; --act3-fg:#E7E4DD;
  --point-bg:#33241E; --point-line:#6E4A3C; --point-fg:#F0B49C; --point-mark:#E5835F;
  --input-bg:#181D1E; --danger:#F2B8B5; --danger-weak:#3A1F1E; --overlay:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5);
  color-scheme:dark; }

html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1440px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.brand{font-family:var(--f-title);font-size:20px;font-weight:600;letter-spacing:.06em}
.spacer{flex:1}
.wtitle{margin:0;font-family:var(--f-title);font-size:21px;font-weight:600;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--danger)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0}
.topbar-in.has-tabs{padding-bottom:2px}
.tab{min-height:44px;padding:0 20px;border:none;background:transparent;color:var(--fg2);font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent-strong);font-weight:700;border-bottom-color:var(--accent)}

/* controls */
.btn{min-height:44px;padding:0 18px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--fg);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface);font-weight:500}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.back{min-height:44px;border:none;background:transparent;color:var(--accent);font-size:15px;display:inline-flex;align-items:center;gap:4px;padding:0 4px}
.icon-btn{width:44px;height:44px;border:none;border-radius:8px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{background:var(--sunken);color:var(--fg)}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.seg button{min-height:40px;padding:0 16px;border:none;border-radius:7px;background:transparent;color:var(--fg2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:500}
.fl{font-size:14px;font-weight:500;color:var(--fg2)}
.sub-l{font-size:13px;color:var(--muted)}
.in,.ta,.sel{width:100%;box-sizing:border-box;border:1px solid var(--line2);border-radius:8px;background:var(--input-bg);color:var(--fg);font-size:16px}
.in{height:46px;padding:0 12px}
.ta{padding:10px 12px;line-height:1.75;resize:vertical;min-height:80px}
.sel{height:44px;padding:0 10px;font-size:14px}
.in:focus,.ta:focus,.sel:focus{border-color:var(--accent);outline:2px solid var(--accent-weak);outline-offset:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.ta.one{min-height:46px;height:46px;resize:none;overflow:hidden;line-height:1.5;padding:10px 12px}
.ta.long.l3{min-height:100px;height:100px}
.ta.long{min-height:76px;height:76px;resize:none;overflow:hidden;line-height:1.6;padding:11px 12px}
.f-name{flex:0 1 320px;min-width:200px}
.f-mini{flex:1 1 200px;min-width:140px}
.f-role{flex:0 0 auto}
.f-role .seg{height:46px;box-sizing:border-box;align-items:center;padding:3px}
.f-role .seg button{min-height:38px}
.f-age{flex:0 0 150px;min-width:0}
.basic-top{display:flex;flex-wrap:wrap;gap:20px 24px;align-items:flex-start;margin-bottom:22px}
.f-title{flex:2 1 320px}
.f-short{flex:1 1 180px;max-width:280px}
.f-len{flex:0 0 auto;min-width:120px}
.readout{height:46px;box-sizing:border-box;padding:0 12px;border-radius:8px;background:var(--sunken);display:flex;align-items:center;font-size:16px}
.page{padding-block:28px 48px}

/* list */
.list-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.list-head h1{margin:0;font-size:24px}
.wl-cols,.work-open{display:grid;grid-template-columns:minmax(0,1fr) 130px 110px 120px;gap:12px;align-items:center}
.wl-cols{padding:0 64px 6px 24px;font-size:13px;color:var(--muted)}
.work-rows{display:flex;flex-direction:column;gap:10px}
.work-row{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding-right:10px}
.work-open{flex:1;min-width:0;min-height:72px;padding:12px 0 12px 24px;border:none;background:transparent;text-align:left;font-size:15px}
.work-open .wt{font-family:var(--f-title);font-size:19px;font-weight:600;overflow-wrap:anywhere}
.work-open .dt{color:var(--muted);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:48px 24px;text-align:center;background:var(--surface);border:1px dashed var(--line2);border-radius:12px;color:var(--fg2)}
.empty p{margin:0 0 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.backup{margin-top:32px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.backup h2{margin:0;font-size:16px;flex-basis:100%}
.backup p{margin:0;font-size:14px;color:var(--muted);flex-basis:100%}
.foot{margin-top:20px;font-size:13px;color:var(--muted)}

/* side layout */
.split{display:flex;gap:24px;align-items:flex-start}
.side{width:280px;flex:none;display:flex;flex-direction:column;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.side.narrow{width:208px}
.side-main{flex:1;min-width:0}
.side-row{display:flex;flex-direction:column;gap:2px}
.side-mv{display:flex;justify-content:flex-end;gap:2px;padding-right:2px}
.side-mv .icon-btn{width:44px;height:36px}
.side-h{margin:4px 8px 6px;font-size:15px;font-weight:700}
.side-note{margin:0 8px 8px;font-size:13px;color:var(--muted)}
.side-item{min-height:48px;padding:8px 12px;border:none;border-radius:8px;background:transparent;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--fg2)}
.side-item[aria-current="true"]{background:var(--accent-weak);color:var(--fg);font-weight:700}
.side-item .cnt{font-size:13px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.side-item .two{display:flex;flex-direction:column;align-items:flex-start;line-height:1.4;min-width:0}
.side-item .two small{font-size:13px;color:var(--muted);font-weight:400}
.role-chip{flex:none;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap}
.role-chip.main{background:var(--accent);color:var(--on-accent)}
.role-chip.major{border:1px solid var(--accent);color:var(--accent-strong);font-weight:500}
.add-dash{min-height:48px;border:1.5px dashed var(--line2);border-radius:10px;background:transparent;color:var(--accent);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.add-dash:hover{border-color:var(--accent)}

/* basic & people */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 28px}
.form-grid .wide{grid-column:1 / -1}
.row-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.stack{display:flex;flex-direction:column;gap:20px}
.person-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.person-head .field{min-width:0}
.arc-head{display:flex;align-items:center;justify-content:space-between;height:22px}
.arc-head .link-btn{margin:-11px 0}
.arc-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.link-btn{border:none;background:transparent;color:var(--muted);font-size:13px;min-height:44px;padding:0 4px}
.link-btn:hover{color:var(--fg)}

/* plot */
.plot-bar,.plot-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);gap:16px}
.plot-bar{margin-bottom:16px}
.plot-bar div{min-height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-align:center;padding:4px 8px;font-variant-numeric:tabular-nums}
.b1{background:var(--act1);color:var(--act1-fg)}.b2{background:var(--act2);color:var(--act2-fg)}.b3{background:var(--act3);color:var(--act3-fg)}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.col-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.col-h b{font-size:15px}
.col-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.act2-in{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.half{display:flex;flex-direction:column;gap:12px;min-width:0}
.grow{flex:1;min-height:260px}
.point{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--point-bg);border:1px solid var(--point-line)}
.point label{font-size:14px;font-weight:700;color:var(--point-fg);display:flex;align-items:center;gap:8px}
.point .ta{min-height:64px;border-color:var(--point-line)}
.hook{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--sunken)}
.hook label{font-size:14px;font-weight:700}
.dia{width:11px;height:11px;flex:none}

/* boxes */
.box-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.box-top p{margin:0;font-size:14px;color:var(--fg2)}
.grp{margin-bottom:22px}
.grp-h{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.grp-h h2{margin:0;font-size:17px}
.grp-h span{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
.card-h .no{font-size:14px;font-weight:700;color:var(--mark);margin-right:4px}
.card-h .sel{width:auto;height:36px;font-size:13px;flex:1;min-width:120px;max-width:190px}
.cf{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start}
.cf label{font-size:13px;font-weight:500;color:var(--fg2);padding-top:10px}
.cf .in{height:40px;font-size:15px}
.cf .ta{min-height:64px;font-size:15px;padding:8px 10px}
.cf .ta.one{min-height:40px;height:40px;padding:7px 10px}
.card-add{min-height:120px}

/* series */
.ep-len label{white-space:nowrap}
.ep-len{display:grid;grid-template-columns:minmax(0,1fr) 64px 20px;gap:6px;align-items:center;min-height:46px;padding:0 10px;border-radius:8px}
.ep-len.changed{background:var(--point-bg)}
.ep-len .in{height:38px;text-align:right;font-variant-numeric:tabular-nums}
.ep-len span{font-size:14px;color:var(--muted)}
.series-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:32px;align-items:center}
.chip{height:30px;padding:0 12px;border-radius:15px;background:var(--accent-weak);color:var(--accent-strong);font-size:13px;font-weight:500;display:inline-flex;align-items:center}
.chips .none{font-size:13px;color:var(--muted)}
.ep-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:14px}
.ep-head h2{margin:0;font-size:22px}
.ep-head span{color:var(--fg2)}

/* templates */
.tpl-note{margin:10px 0 18px;font-size:14px;color:var(--fg2)}
.tpl-cols,.tpl-row{display:grid;grid-template-columns:96px minmax(0,1fr) 150px 44px;gap:10px;align-items:center}
.tpl-cols{padding:0 12px 4px;font-size:13px;color:var(--muted)}
.tpl-row{min-height:62px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.tpl-row.fixed{background:var(--surface2)}
.tpl-row .mv{display:flex;gap:4px}
.tag{font-size:13px;color:var(--muted)}

/* modal & toast */
.overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-width:640px;background:var(--surface);border-radius:16px;padding:28px 30px;display:flex;flex-direction:column;gap:20px;box-shadow:0 18px 48px var(--shadow);box-sizing:border-box}
.modal h2{margin:0;font-size:21px}
.modal p{margin:0;color:var(--fg2)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.kind-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kind-grid button{min-height:64px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.kind-grid button b{font-size:15px;font-weight:500}
.kind-grid button small{font-size:12px;color:var(--muted)}
.kind-grid button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-weak)}
.kind-grid button[aria-pressed="true"] b{font-weight:700;color:var(--accent-strong)}
.inline{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
.num{display:flex;align-items:center;gap:8px}
.num .in{width:96px;text-align:right;font-variant-numeric:tabular-nums}
.boxed{background:var(--sunken);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 6px;border-radius:8px}
.check:hover{background:var(--sunken)}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.check small{color:var(--muted);font-size:13px}
.err-text{color:var(--danger);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px var(--shadow);max-width:calc(100vw - 32px)}
.loading{padding:80px 16px;text-align:center;color:var(--muted)}

/* sizing: compact controls matched to 脚本エディタ (buttons and tabs 34px / 13px, body 14px, inputs 15px) */
body{font-size:14px}
.topbar-in{padding-block:10px;gap:8px 14px}
.brand{font-size:18px;font-family:var(--f-body);font-weight:400;letter-spacing:.02em;font-feature-settings:"palt"}
.wtitle{font-size:18px;font-family:var(--f-body);font-weight:500}
.work-open .wt{font-family:var(--f-body);font-weight:500}
.meta{margin-left:-8px}
.meta{font-size:13px}
.status{font-size:12px}
.tab{min-height:36px;padding:0 16px;font-size:14px;border-bottom-width:2px}

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var VERSION = '0.61';
var KINDS = {
  single:{label:'単発作品', def:null, hint:'長さを入力'},
  serial:{label:'連続作品', def:null, hint:'話数を設定'}
};
var KIND_ORDER = ['single','serial'];
var SEGS = [
  {k:'a1', label:'第一幕', from:0, to:.25},
  {k:'pp1', label:'プロットポイント1', short:'PP1', side:'プロットポイント(PP)1', point:true},
  {k:'a2a', label:'第二幕前半', from:.25, to:.5},
  {k:'mp', label:'ミッドポイント', short:'MP', side:'ミッドポイント(MP)', point:true},
  {k:'a2b', label:'第二幕後半', from:.5, to:.75},
  {k:'pp2', label:'プロットポイント2', short:'PP2', side:'プロットポイント(PP)2', point:true},
  {k:'a3', label:'第三幕', from:.75, to:1}
];
var SEG_INDEX = {}; SEGS.forEach(function(s,i){ SEG_INDEX[s.k]=i; });
var SEG_BY = {}; SEGS.forEach(function(s){ SEG_BY[s.k]=s; });
var ACTS = [['a1','第一幕'],['a2','第二幕'],['a3','第三幕']];
var TPL_TABS = [['basic','基本設定'],['person','人物'],['arc','アーク'],['card','箱書きカード']];
var LOCAL_KEY = 'kousei-planner-v1';

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fld(label, multi){ return {id:'f'+uid(), label:label, multi:!!multi}; }
function mins(L, r){ return Math.round(L * r); }
function fmtDate(t){ if(!t) return ''; var d = new Date(t); return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
function isBlank(v){ return v == null || String(v).trim() === ''; }
function hasContent(obj){ if(!obj) return false; return Object.keys(obj).some(function(k){ return !isBlank(obj[k]); }); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function toInt(v, min, max){ var n = parseInt(String(v).replace(/[^\d]/g,''), 10); if(isNaN(n)) return null; return Math.min(max, Math.max(min, n)); }

var ICON = {
  trash:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h12M7 5V3h4v2M5 5l1 10h6l1-10"/></svg>',
  up:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg>',
  down:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>',
  plus:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3L5 9l6 6"/></svg>',
  undo:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
  redo:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>',
  floppy:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>',
  dup:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  grip:'<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="3.5" r="1.4"/><circle cx="10.5" cy="3.5" r="1.4"/><circle cx="5.5" cy="8" r="1.4"/><circle cx="10.5" cy="8" r="1.4"/><circle cx="5.5" cy="12.5" r="1.4"/><circle cx="10.5" cy="12.5" r="1.4"/></svg>',
  dia:'<svg class="dia" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l6 6-6 6-6-6z" fill="var(--point-mark)"/></svg>'
};

var BASIC_ORDER = ['ジャンル','ログライン','テーマ','時代','場所（舞台）','主人公の目的','主人公の障害','メモ','類似作品・参考にした作品'];
var LAYOUT = {
  basic:{'ジャンル':{w:'M',rows:1}, 'ログライン':{w:'half',rows:3,nl:true}, 'テーマ':{w:'half',rows:3}, '時代':{w:'half',rows:1,nl:true}, '場所（舞台）':{w:'half',rows:1},
    '主人公の目的':{w:'half',rows:3,nl:true}, '主人公の障害':{w:'half',rows:3}, 'メモ':{w:'half',rows:5,nl:true}, '類似作品・参考にした作品':{w:'half',rows:5}},
  person:{'年齢':{w:'S',rows:1}, '職業':{w:'fill',rows:1}, '目的':{w:'fill',rows:1,nl:true}, '経歴':{w:'full',rows:2,nl:true}, 'ほかの人物との関係':{w:'full',rows:1,nl:true}},
  arc:{}, card:{'登場人物':{rows:1,people:true}}
};
function migLayout(sch){
  if(!sch) return;
  var b = sch.basic;
  if(b && b.length){
    var pos = [], known = [];
    b.forEach(function(f, i){ if(BASIC_ORDER.indexOf(f.label) >= 0){ pos.push(i); known.push(f); } });
    known.sort(function(x, y){ return BASIC_ORDER.indexOf(x.label) - BASIC_ORDER.indexOf(y.label); });
    pos.forEach(function(at, j){ b[at] = known[j]; });
  }
  ['basic','person','arc','card'].forEach(function(tab){
    (sch[tab] || []).forEach(function(f){
      if(f.rows) return;
      var d = (LAYOUT[tab] || {})[f.label] || {};
      f.rows = d.rows || (f.multi ? (tab === 'basic' ? 3 : 2) : 1);
      f.w = d.w || (tab === 'basic' ? 'half' : (f.multi ? 'full' : 'fill'));
      f.nl = d.nl != null ? d.nl : (tab === 'person' && !!f.multi);
      if(d.people) f.people = true;
    });
  });
}
function defaultTemplate(){
  var t = {
    basic:[fld('ジャンル',0), fld('ログライン',1), fld('テーマ',1), fld('時代',0), fld('場所（舞台）',0), fld('主人公の目的',1), fld('主人公の障害',1), fld('メモ',1), fld('類似作品・参考にした作品',1)],
    person:[fld('年齢',0), fld('職業',0), fld('目的',0), fld('経歴',1), fld('ほかの人物との関係',1)],
    arc:[fld('始まりの状態',1), fld('変化のきっかけ',1), fld('終わりの状態',1)],
    card:[fld('場面',0), fld('登場人物',0), fld('出来事',1), fld('セリフ',1)]
  };
  migLayout(t);
  return t;
}
function migPerson(list){
  if(!list) return false;
  var labels = list.map(function(f){ return f.label; }).join('|');
  if(labels !== '年齢|職業|目的|ほかの人物との関係') return false;
  list[2].multi = false; list.splice(3, 0, fld('経歴', 1)); return true;
}
function migRef(list){
  if(!list || list.some(function(f){ return f.label === '類似作品・参考にした作品'; })) return;
  list.push(fld('類似作品・参考にした作品', 1));
}
function migMemo(list){
  if(!list || list.some(function(f){ return f.label === 'メモ'; })) return;
  var i = list.findIndex(function(f){ return f.label === '類似作品・参考にした作品'; });
  if(i < 0) list.push(fld('メモ', 1)); else list.splice(i, 0, fld('メモ', 1));
}
function migEra(list, values){
  if(!list) return;
  var i = list.findIndex(function(f){ return f.label === '時代・舞台'; });
  if(i < 0 || list.some(function(f){ return f.label === '場所（舞台）'; })) return;
  var era = list[i]; era.label = '時代'; era.multi = false;
  var place = fld('場所（舞台）', 0);
  list.splice(i, 1);
  var g = list.find(function(f){ return f.label === 'ジャンル'; });
  var at = g ? list.indexOf(g) + 1 : 0;
  list.splice(at, 0, era, place);

    Object.keys(after).forEach(function(eid){ if(!before[eid] || JSON.stringify(before[eid]) !== JSON.stringify(after[eid])) markEp(w, eid); });
    S.episodes[w.id] = after;
  }
  saveWorkSoon(w);
}

/* ---------- binding ---------- */
function sceneCtx(){
  var w = curWork();
  if(w.kind === 'serial'){
    var ep = S.episodes[w.id][S.epId];
    return {owner:ep, list:ep.scenes, length:ep.length, save:function(){ saveEpSoon(w, ep); }};
  }
  return {owner:w, list:w.scenes, length:w.length, save:function(){ saveWorkSoon(w); }};
}
function resolve(bind){
  var parts = bind.split('|'), head = parts[0], path = parts.slice(1), w = curWork(), root = null, save = null;
  if(head === 'W'){ root = w; save = function(){ saveWorkSoon(w); }; }
  else if(head === 'E'){ var ep = S.episodes[w.id][S.epId]; root = ep; save = function(){ saveEpSoon(w, ep); }; }
  else if(head.indexOf('P:') === 0){ var pid = head.slice(2); root = w.people.find(function(p){ return p.id === pid; }); save = function(){ saveWorkSoon(w); }; }
  else if(head.indexOf('S:') === 0){ var c = sceneCtx(), sid = head.slice(2); root = c.list.find(function(s){ return s.id === sid; }); save = c.save; }
  else if(head.indexOf('T:') === 0){ var t = head.split(':'); root = S.templates[t[1]][t[2]].find(function(x){ return x.id === t[3]; }); save = saveTemplatesSoon; }
  return {root:root, path:path, save:save};
}
function setPath(root, path, val){
  var o = root;
  for(var i=0;i<path.length-1;i++){ if(o[path[i]] == null || typeof o[path[i]] !== 'object') o[path[i]] = {}; o = o[path[i]]; }
  o[path[path.length-1]] = val;
}
function getPath(root, path){ var o = root; for(var i=0;i<path.length;i++){ if(o == null) return ''; o = o[path[i]]; } return o == null ? '' : o; }

document.addEventListener('input', function(e){
  var el = e.target.closest && e.target.closest('[data-bind]'); if(!el) return;
  var r = resolve(el.dataset.bind); if(!r.root) return;
  if(el.dataset.bind.indexOf('T:') !== 0) textCheckpoint(el.dataset.bind);
  setPath(r.root, r.path, el.value); r.save();
  fitOne(el);
  var b = el.dataset.bind;
  if(b === 'W|title'){ var h = document.getElementById('hdr-title'); if(h) h.textContent = el.value || '無題の作品'; }
  if(/^P:[^|]+\|name$/.test(b)){
    var pid = b.slice(2, b.indexOf('|'));
    document.querySelectorAll('[data-pname="' + pid + '"]').forEach(function(n){ n.textContent = el.value || '名前未設定'; });
  }
});

function inputFor(bind, value, multi, id, extra){
  extra = extra || '';
  if(multi === 'line') return '<input id="' + id + '" class="in" type="text" value="' + esc(value) + '" data-bind="' + esc(bind) + '"' + extra + '>';
  if(!multi) return '<textarea id="' + id + '" class="ta one" rows="1" data-bind="' + esc(bind) + '"' + extra + '>' + esc(value) + '</textarea>';
  if(multi) return '<textarea id="' + id + '" class="ta long" rows="2" data-bind="' + esc(bind) + '"' + extra + '>' + esc(value) + '</textarea>';
  return '<input id="' + id + '" class="in" type="text" value="' + esc(value) + '" data-bind="' + esc(bind) + '"' + extra + '>';
}
function fieldInput(bind, value, f, id){
  var r = Math.max(1, Math.min(30, parseInt(f.rows, 10) || 1));
  return '<textarea id="' + id + '" class="ta auto" rows="' + r + '" style="--rows:' + r + '" data-bind="' + esc(bind) + '">' + esc(value) + '</textarea>';
}
function fwClass(w){ return 'fw-' + ({S:'S', M:'M', half:'half', fill:'fill', full:'full'}[w] || 'fill'); }
function flowRows(fields, cell, lead, trail, groupLead){
  var rows = [], first = (lead || []).slice(), i = 0;
  while(i < fields.length && !fields[i].nl && fields[i].w !== 'full'){ first.push(cell(fields[i])); i++; }
  first = first.concat(trail || []);
  if(first.length) rows.push(first);
  var cur = null, needLead = !!groupLead;
  for(; i < fields.length; i++){
    var f = fields[i];
    if(!cur || f.nl || f.w === 'full' || cur.full){
      if(cur) rows.push(cur.items);
      cur = {items:[], full:false};
      if(needLead){ cur.items.push(groupLead); needLead = false; }
    }
    cur.items.push(cell(f)); if(f.w === 'full') cur.full = true;
  }
  if(cur) rows.push(cur.items);
  if(needLead) rows.push([groupLead]);
  return rows.map(function(r){ return '<div class="frow">' + r.join('') + '</div>'; }).join('');
}

var syncBusy = false;
function syncPanel(){

  } else {

      '<div class="sync-form">' +

      '</div>';

function authError(e){
  var c = e && e.code || '';
  if(c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-login-credentials') return 'メールアドレスかパスワードが違います';
  if(c === 'auth/invalid-email') return 'メールアドレスの形が正しくありません';
  if(c === 'auth/too-many-requests') return '試行が多すぎるため、しばらく待ってからお試しください';
  if(c === 'auth/network-request-failed') return '通信できませんでした。接続を確かめてください';
  return 'ログインできませんでした';
}
/* ログイン欄はフォームにしない。フォームにすると、Safariがパスワードの自動入力のあとにログインまで済ませてしまうため（脚本エディタと同じ作り） */

}
function signOutNow(){

    function(){ syncBusy = false; render(); toast('ログアウトできませんでした'); });
}
function resetPass(){
  var el = document.getElementById('si-mail'), mail = el ? el.value.trim() : '';
  if(!mail){ toast('メールアドレスを入力してから押してください'); if(el) el.focus(); return; }

/* ---------- boxes ---------- */
function sortScenes(list){
  return list.map(function(s,i){ return {s:s,i:i}; }).sort(function(a,b){ return (SEG_INDEX[a.s.seg]-SEG_INDEX[b.s.seg]) || (a.i-b.i); }).map(function(x){ return x.s; });
}
function sidePlot(w, ctx){
  if(S.boxFilter === 'all') return '<p class="side-plot-note">段を選ぶと、その段のプロットがここに表示されます。</p>';
  var seg = SEG_BY[S.boxFilter], root = w.kind === 'serial' ? 'E' : 'W', plot = ctx.owner.plot || {};
  return '<div class="side-plot"><label class="fl" for="sp-' + seg.k + '">プロット：' + seg.label + '</label>' +
    '<textarea id="sp-' + seg.k + '" class="ta fit2 side-ta" rows="' + (seg.point ? 3 : 8) + '" data-bind="' + root + '|plot|' + seg.k + '">' + esc(plot[seg.k]) + '</textarea>' +
    '<p class="side-plot-note">ここで直した内容は、プロット画面にも反映されます。</p></div>';
}
function boxesBlock(w, ctx){
  var list = ctx.list, L = ctx.length, schema = w.schema.card || [];
  var counts = {}; SEGS.forEach(function(s){ counts[s.k] = 0; });
  list.forEach(function(s){ counts[s.seg] = (counts[s.seg]||0) + 1; });
  if(S.boxFilter !== 'all' && !SEG_BY[S.boxFilter]) S.boxFilter = 'all';
  var side = '<aside class="side narrow compact" aria-label="段で絞り込む">' +
    '<button type="button" class="side-item" data-act="box-filter" data-v="all"' + (S.boxFilter === 'all' ? ' aria-current="true"' : '') + '>すべて<span class="cnt">' + list.length + '</span></button>' +
    SEGS.map(function(s){ return '<button type="button" class="side-item" data-act="box-filter" data-v="' + s.k + '"' + (S.boxFilter === s.k ? ' aria-current="true"' : '') + '>' + (s.side || s.label) + '<span class="cnt">' + counts[s.k] + '</span></button>'; }).join('') +
    sidePlot(w, ctx) + '</aside>';
  var groups = S.boxFilter === 'all' ? SEGS.filter(function(s){ return counts[s.k] > 0; }) : [SEG_BY[S.boxFilter]];
  var body = groups.map(function(seg){
    var cards = list.map(function(sc, idx){ return {sc:sc, n:idx+1}; }).filter(function(x){ return x.sc.seg === seg.k; });
    var range = seg.point ? '' : mins(L, seg.from) + '〜' + mins(L, seg.to) + '分';
    var sum = cards.reduce(function(a, x){ return a + (toInt(x.sc.min, 0, 999) || 0); }, 0);
    var segLen = seg.point ? 0 : mins(L, seg.to) - mins(L, seg.from);
    var tot = sum ? '<span>シーン計 ' + sum + '分' + (!seg.point && sum > segLen ? '<b class="over">（目安より' + (sum - segLen) + '分長い）</b>' : '') + '</span>' : '';
    return '<section class="grp" data-seg="' + seg.k + '" aria-label="' + seg.label + '"><div class="grp-h"><h2>' + seg.label + '</h2><span>' + range + '</span>' + tot + '</div><div class="cards">' +
      cards.map(function(x){ return cardHTML(x.sc, x.n, schema, w); }).join('') +
      '<button type="button" class="add-dash card-add" data-act="add-scene" data-v="' + seg.k + '">' + ICON.plus + seg.label + 'にシーンを追加</button>' +
      '</div></section>';
  }).join('');
  if(S.boxFilter === 'all' && list.length === 0){
    body = '<div class="empty"><p>まだシーンがありません。「シーンを追加」から最初のシーンを作ってください。</p></div>';
  }
  var allMin = list.reduce(function(a, x){ return a + (toInt(x.min, 0, 999) || 0); }, 0);
  var top = '<div class="box-top"><p>シーン ' + list.length + '件' + (allMin ? '・合計 ' + allMin + '分（尺 ' + L + '分）' : '') + '</p><span class="spacer"></span>' + (list.length ? '<button type="button" class="btn" data-act="copy-boxes">すべてのシーンをテキストでコピー</button>' : '') + '<button type="button" class="btn primary" data-act="add-scene" data-v="' + (S.boxFilter === 'all' ? '' : S.boxFilter) + '">' + ICON.plus + 'シーンを追加</button></div>';
  return '<div class="split">' + side + '<div class="side-main">' + top + body + '</div></div>';
}
function cardHTML(sc, n, schema, w){
  var opts = SEGS.map(function(s){ return '<option value="' + s.k + '"' + (s.k === sc.seg ? ' selected' : '') + '>' + (s.short || s.label) + '</option>'; }).join('');
  var names = sortPeople(w.people || []).map(function(p){ return p.name; }).filter(function(x){ return !isBlank(x); });
  return '<article class="card" id="card-' + sc.id + '" data-id="' + sc.id + '" aria-label="シーン' + n + '"><div class="card-h">' +
    '<button type="button" class="grip" data-id="' + sc.id + '" aria-label="シーン' + n + 'を移動（ドラッグ、または上下の矢印キー）" title="ドラッグして移動">' + ICON.grip + '</button>' +
    '<span class="no">シーン' + n + '</span>' +
    '<label class="sr" for="seg-' + sc.id + '">シーン' + n + 'の段</label><select id="seg-' + sc.id + '" class="sel" data-change="scene-seg" data-id="' + sc.id + '">' + opts + '</select>' +
    '<span class="spacer"></span>' +
    '<button type="button" class="icon-btn" data-act="copy-scene" data-id="' + sc.id + '" aria-label="シーン' + n + 'をコピー" title="このシーンをコピー">' + ICON.dup + '</button></div>' +
    schema.map(function(f){
      var id = 's-' + sc.id + '-' + f.id;
      var picks = (f.people && names.length) ? '<div class="picks" role="group" aria-label="人物の候補">' + names.map(function(nm){
        return '<button type="button" class="pick" data-act="pick-name" data-target="' + id + '" data-name="' + esc(nm) + '">' + esc(nm) + '</button>';
      }).join('') + '</div>' : '';

        fieldInput('S:' + sc.id + '|values|' + f.id, getPath(sc, ['values', f.id]), f, id) + picks + '</div></div>';
    }).join('') +
    '<div class="cf"><label for="m-' + sc.id + '">目安</label><div class="cf-in num-row"><input id="m-' + sc.id + '" class="in min-in" type="text" inputmode="numeric" value="' + esc(sc.min || '') + '" data-bind="S:' + sc.id + '|min" data-change="scene-min" data-id="' + sc.id + '"><span class="sub-l">分</span><span class="spacer"></span>' +
    '<button type="button" class="icon-btn card-del" data-act="scene-del" data-id="' + sc.id + '" aria-label="シーン' + n + 'を削除">' + ICON.trash + '</button></div></div>' +
    '</article>';
}

/* ---------- series ---------- */
function renderSeries(w){
  var eps = epsOf(w);
  var side = '<aside class="side narrow" aria-label="各話の長さ"><div class="side-h">各話の長さ</div><p class="side-note">基本の長さ：' + w.baseLength + '分</p>' +
    eps.map(function(ep, i){
      return '<div class="ep-len' + (ep.length !== w.baseLength ? ' changed' : '') + '"><label for="len-' + ep.id + '">第' + (i+1) + '話</label>' +
        '<input id="len-' + ep.id + '" class="in" type="text" inputmode="numeric" value="' + ep.length + '" data-change="ep-len" data-id="' + ep.id + '"><span>分</span></div>';
    }).join('') +
    '<p class="side-note" style="margin-top:8px">色のついた話は、基本の長さから変更しています。</p>' +
    '<button type="button" class="btn" data-act="ep-count">話数・長さを変更</button></aside>';
  var s = w.series;
  function chips(k){ var ids = (s[k] && s[k].eps) || []; var list = ids.filter(function(id){ return epNo(w,id) > 0; }).sort(function(a,b){ return epNo(w,a)-epNo(w,b); });
    return '<div class="chips">' + (list.length ? list.map(function(id){ return '<span class="chip">第' + epNo(w,id) + '話</span>'; }).join('') : '<span class="none">まだ割り当てていません</span>') + '</div>'; }
  function act(k, label, extra){
    return '<section class="col" aria-label="シリーズの' + label + '"><div class="col-h"><b>' + label + '</b></div>' + chips(k) +
      '<button type="button" class="btn" data-act="assign" data-v="' + k + '">話を割り当て</button>' +
      '<textarea id="sr-' + k + '-text" class="ta grow" rows="8" aria-label="シリーズの' + label + 'の内容" data-bind="W|series|' + k + '|text">' + esc(getPath(s, [k,'text'])) + '</textarea>' + (extra||'') + '</section>';
  }
  function point(k, label){ return '<div class="point"><label for="sr-' + k + '">' + ICON.dia + label + '</label><textarea id="sr-' + k + '" class="ta" rows="2" data-bind="W|series|' + k + '">' + esc(s[k]) + '</textarea></div>'; }
  var main = '<div class="series-grid">' + act('a1','第一幕', point('pp1','プロットポイント1')) + act('a2','第二幕', point('mp','ミッドポイント') + point('pp2','プロットポイント2')) + act('a3','第三幕') + '</div>';
  return '<main class="page gut"><div class="wrap"><div class="split">' + side + '<div class="side-main">' + main + '</div></div></div></main>';
}

/* ---------- episodes ---------- */
function renderEpisodes(w){
  var eps = epsOf(w);
  if(!eps.some(function(e){ return e.id === S.epId; })) S.epId = eps.length ? eps[0].id : null;
  var side = '<aside class="side narrow" aria-label="話の一覧">' + eps.map(function(ep, i){
    return '<button type="button" class="side-item" data-act="pick-ep" data-id="' + ep.id + '"' + (ep.id === S.epId ? ' aria-current="true"' : '') + '>第' + (i+1) + '話<span class="cnt">' + ep.length + '分</span></button>';
  }).join('') + '</aside>';
  var ep = S.episodes[w.id][S.epId];
  var main;
  if(!ep){ main = '<div class="empty"><p>話がありません。「シリーズ構成」で話数を設定してください。</p></div>'; }
  else {
    var act = actOfEp(w, ep.id);
    main = '<div class="ep-head"><h2>第' + epNo(w, ep.id) + '話</h2><span>' + ep.length + '分' + (act ? '・シリーズの' + act : '') + '</span>' +
      '<div class="seg" role="group" aria-label="第' + epNo(w, ep.id) + '話の表示" style="margin-left:auto">' +
      '<button type="button" data-act="ep-sub" data-v="plot" aria-pressed="' + (S.epSub === 'plot') + '">プロット</button>' +
      '<button type="button" data-act="ep-sub" data-v="boxes" aria-pressed="' + (S.epSub === 'boxes') + '">箱書き</button></div></div>' +
      (S.epSub === 'plot' ? plotBlock('E', ep, ep.length, true) : boxesBlock(w, sceneCtx()));
  }
  return '<main class="page gut"><div class="wrap"><div class="split">' + side + '<div class="side-main">' + main + '</div></div></div></main>';
}

/* ---------- templates ---------- */

function render(){

  else if(S.view === 'work'){
    var w = curWork();
    if(!w){ S.view = 'list'; return render(); }
    html = workHeader(w);
    if(S.tab === 'basic') html += renderBasic(w);
    else if(S.tab === 'people') html += renderPeople(w);
    else if(S.tab === 'plot') html += '<main class="page gut"><div class="wrap">' + plotBlock('W', w, w.length, false) + '</div></main>';
    else if(S.tab === 'boxes') html += '<main class="page gut"><div class="wrap">' + boxesBlock(w, sceneCtx()) + '</div></main>';
    else if(S.tab === 'series') html += renderSeries(w);
    else if(S.tab === 'episodes') html += renderEpisodes(w);
  }
  /* 上部のメニューの枠は作り直さず、中身だけを入れ替える（iPadOS 26 のホーム画面のアプリでは、
     上端の無地の帯が一度でも消えると、画面の上端がぼかされるため） */
  var top = document.getElementById('topbar'), hm = /^<header class="topbar">([\s\S]*?)<\/header>/.exec(html);
  if(hm){ top.innerHTML = hm[1]; html = html.slice(hm[0].length); }
  app.innerHTML = html;
  fitAll(app);
  try{ localStorage.setItem(LOCAL_KEY + '-ui', JSON.stringify({tplKind:S.tplKind, listFilter:S.listFilter})); }catch(e){}
}
function autosize(el){ el.style.height = ''; if(!el.value) return; if(el.scrollHeight > el.clientHeight + 2) el.style.height = (el.scrollHeight + 2) + 'px'; }
function autosizeMin(el){ el.style.minHeight = ''; if(el.scrollHeight > el.clientHeight + 2) el.style.minHeight = (el.scrollHeight + 2) + 'px'; }
function fitOne(el){
  if(el.classList.contains('fit')){ document.querySelectorAll('textarea.fit').forEach(autosizeMin); return; }
  if(el.classList.contains('auto') || el.classList.contains('one') || el.classList.contains('long') || el.classList.contains('fit2')) autosize(el);
}
function fitAll(root){
  root.querySelectorAll('textarea.auto, textarea.one, textarea.long, textarea.fit2').forEach(autosize);
  root.querySelectorAll('textarea.fit').forEach(autosizeMin);
}
window.addEventListener('resize', function(){ fitAll(document); });
function focusSoon(sel){ setTimeout(function(){ var el = document.querySelector(sel); if(el){ el.focus(); if(el.scrollIntoView) el.scrollIntoView({block:'center', behavior:'smooth'}); } }, 30); }

function readModal(ids){ var o = {}; ids.forEach(function(id){ var el = document.getElementById(id); if(el) o[id] = el.value; }); return o; }

function createWork(){
  var m = S.modal, v = readModal(['nw-title','nw-len','nw-eps','nw-base']);
  m.title = v['nw-title'] || ''; if(v['nw-len'] != null) m.len = v['nw-len']; if(v['nw-eps'] != null) m.eps = v['nw-eps']; if(v['nw-base'] != null) m.base = v['nw-base'];
  var tpl = clone(S.templates[m.kind]);
  var w = {v:1, id:'w-' + uid(), title:m.title.trim() || '無題の作品', kind:m.kind, createdAt:Date.now(), updatedAt:Date.now(),
    schema:tpl, basic:{}, people:[]};
  if(m.kind === 'serial'){
    var n = toInt(m.eps, 1, 100), base = toInt(m.base, 1, 600);
    if(!n || !base){ m.err = '話数と基本の1話の長さを数字で入力してください。'; renderModal(false); return; }
    w.baseLength = base; w.epOrder = [];
    w.series = {a1:{text:'',eps:[]}, a2:{text:'',eps:[]}, a3:{text:'',eps:[]}, pp1:'', mp:'', pp2:''};
    S.episodes[w.id] = {};
    for(var i=0;i<n;i++){ var ep = newEp(base); S.episodes[w.id][ep.id] = ep; w.epOrder.push(ep.id); }
    S.works[w.id] = w;
    epsOf(w).forEach(function(ep){ saveEpSoon(w, ep); });
    S.tab = 'basic';
  } else {
    var L = toInt(m.len, 1, 600);

function newEp(len){ return {id:'e-' + uid(), length:len, plot:emptyPlot(true), scenes:[]}; }

function addScene(seg){
  var w = curWork(), ctx = sceneCtx();
  if(!seg){ seg = ctx.list.length ? ctx.list[ctx.list.length-1].seg : 'a1'; }
  var sc = {id:'s' + uid(), seg:seg, values:{}};

function moveScene(id, dir){

  if(i < 0 || j < 0 || j >= list.length || list[j].seg !== list[i].seg) return;

async function exportBackup(){
  if(!S.dl) return;
  flushAll();
  var data = {app:'kyakuhon-kousou', version:VERSION, exportedAt:new Date().toISOString(), templates:S.templates,
    works:Object.keys(S.works).map(function(id){ var w = clone(S.works[id]); if(w.kind === 'serial') w.episodes = epsOf(S.works[id]).map(clone); return w; })};
  var d = new Date(), name = '構成プランナー_バックアップ_' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.json';
  try{ await S.dl.save({filename:name, data:JSON.stringify(data, null, 1)}); toast('バックアップを保存しました'); }
  catch(e){ if(e && e.code !== 'declined') toast('バックアップを保存できませんでした'); }
}
function importBackup(file){
  var reader = new FileReader();
  reader.onload = function(){
    var data = null;
    try{ data = JSON.parse(reader.result); }catch(e){}
    if(!data || data.app !== 'kyakuhon-kousou' || !Array.isArray(data.works)){ toast('このファイルは構成プランナーのバックアップではありません'); return; }
    askConfirm('バックアップを読み込む', '作品' + data.works.length + '件と、ひな形を読み込みます。同じ作品がある場合は、バックアップの内容で上書きします。', '読み込む', false, function(){
      if(data.templates) { S.templates = data.templates; migrateTemplates(); saveTemplatesSoon(); }
      data.works.forEach(function(w){
        var eps = w.episodes; delete w.episodes;
        S.works[w.id] = w;
        delete w.rev; delete w.dev; migrateWork(w);
        if(w.kind === 'serial'){ S.episodes[w.id] = {}; (eps || []).forEach(function(ep){ S.episodes[w.id][ep.id] = ep; markEp(w, ep.id); }); }
        saveWorkQuiet(w);
      });
      closeModal(); render(); toast('バックアップを読み込みました');
    });
  };
  reader.readAsText(file);
}

document.addEventListener('change', function(e){
  var el = e.target;
  if(el.id === 'import-file' && el.files && el.files[0]){ importBackup(el.files[0]); el.value = ''; return; }
  var a = el.dataset && el.dataset.change; if(!a) return;

    var ctx = sceneCtx(), sc = ctx.list.find(function(s){ return s.id === el.dataset.id; }); if(!sc) return;
    checkpoint(); sc.seg = el.value;

    var ep = S.episodes[w.id][el.dataset.id], n = toInt(el.value, 1, 600);

    var nm = toInt(el.value, 0, 999); scm.min = nm == null ? '' : String(nm); cm.save(); renderKeep();
  } else if(a === 'as-check'){

  }
});

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if(!el) return;
  var a = el.dataset.act, id = el.dataset.id, v = el.dataset.v, w = curWork();

      saveWorkSoon(nw); render(); toast('「' + nw.title + '」を作りました'); break;

    var name = (w.title || '構成プランナー').replace(/[\\/:*?"<>|]/g, '_') + '.pdf';
    m.busy = false; renderModal(false);
    try{ await S.dl.save({filename:name, data:blob}); closeModal(); toast('PDFを保存しました'); }
    catch(e){ if(e && e.code === 'declined'){ return; } m.err = 'PDFを保存できませんでした。'; renderModal(false); }
  }catch(err){
    m.busy = false; m.err = 'PDFを作成できませんでした。もう一度お試しください。'; renderModal(false);
  }
}

/* ---------- boot ---------- */
async function boot(){
  try{ var ui = JSON.parse(localStorage.getItem(LOCAL_KEY + '-ui') || 'null'); if(ui){ if(KINDS[ui.tplKind]) S.tplKind = ui.tplKind; if(ui.listFilter && (ui.listFilter === 'all' || KINDS[ui.listFilter])) S.listFilter = ui.listFilter; } }catch(e){}
  var local = await loadLocal();
  if(local){
    S.templates = local.templates || null; S.works = local.works || {}; S.episodes = local.episodes || {};
    if(local.meta){ M = local.meta; M.works = M.works || {}; M.tpl = M.tpl || {base:0, dirty:false}; M.deleted = M.deleted || {}; }
    dirtyEps = local.dirtyEps || {};
  }
  var fresh = !S.templates;
  var tch = migrateTemplates();
  if(fresh) M.tpl.fresh = true; else if(tch) saveTemplatesSoon(true);
  Object.keys(S.works).forEach(function(id){
    var w = S.works[id];
    if(w.kind === 'serial' && !S.episodes[id]) S.episodes[id] = {};
    if(migrateWork(w)) saveWorkQuiet(w, true);
  });
  render();
  persistLocalNow();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  Store.init();
  render();
}
boot();
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').then(function(){
    return navigator.serviceWorker.ready;
  }).then(function(reg){ if(reg.active) reg.active.postMessage('ensure'); }).catch(function(){});
}
})();
</script>
